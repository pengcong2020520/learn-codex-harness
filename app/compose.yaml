name: codex-agent
x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
x-agent-build: &agent-build
  context: .
  args:
    NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    APT_MIRROR: ${APT_MIRROR:-}
    CONTAINER_APP_DIR: ${CONTAINER_APP_DIR:-}
x-gateway-env: &gateway-env
  AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:-}
  ARK_API_KEY: ${ARK_API_KEY:-}
  KIMI_API_KEY: ${KIMI_API_KEY:-}
  DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  XAI_API_KEY: ${XAI_API_KEY:-}
  ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
  HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
services:
  setup:
    profiles: [setup]
    image: node:24.19.0-slim@sha256:a9f5f7c91a432850b2a8a7797adf5eadb6c733ceed61167806cee7ea7fbc29df
    user: "0:0"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    volumes: [".:${PWD:-/nonexistent}"]
    working_dir: ${PWD:-/nonexistent}
    environment:
      HOST_APP_DIR: ${PWD:-/nonexistent}
      COMPOSE_PROFILES: ${COMPOSE_PROFILES:-}
    entrypoint: ["node", "scripts/setup.mjs", "--container"]
    command: []
  check:
    profiles: [tools]
    restart: "no"
    build: *agent-build
    image: codex-agent:current
    user: "0:1000"
    cap_drop: [ALL]
    cap_add: [DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    read_only: true
    working_dir: ${CONTAINER_APP_DIR:-/nonexistent}
    environment:
      HOST_APP_DIR: ${PWD:-/nonexistent}
    command: ["node", "scripts/production-check.mjs", "--root", "/project"]
    volumes:
      - type: bind
        source: .
        target: /project
        read_only: true
        bind: { create_host_path: false }
  prepare:
    build: *agent-build
    image: codex-agent:current
    restart: "no"
    user: "0:1000"
    cap_drop: [ALL]
    # 首次需在普通用户拥有的项目目录中创建挂载源；不把写权限能力给长期服务。
    cap_add: [CHOWN, FOWNER, DAC_OVERRIDE]
    security_opt: ["no-new-privileges:true"]
    network_mode: none
    command: ["node", "scripts/compose-init.mjs", "prepare"]
    volumes: [".:/prepare"]
    environment:
      <<: *gateway-env
      CONTAINER_APP_DIR: ${CONTAINER_APP_DIR:-}
      AGENT_CLUSTER_NODES: ${AGENT_CLUSTER_NODES-node-a}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:-}
      ETCD_HEALTH_PASSWORD: ${ETCD_HEALTH_PASSWORD:-}
      AGENT_PREVIEW_SECRET: ${AGENT_PREVIEW_SECRET:-}
      AGENT_NODE_KEY_A: ${AGENT_NODE_KEY_A:-}
      AGENT_NODE_KEY_A_HASH: ${AGENT_NODE_KEY_A_HASH:-}
      AGENT_NODE_A_DB_PASSWORD: ${AGENT_NODE_A_DB_PASSWORD:-}
      ETCD_NODE_A_PASSWORD: ${ETCD_NODE_A_PASSWORD:-}
      AGENT_NODE_KEY_B: ${AGENT_NODE_KEY_B:-}
      AGENT_NODE_KEY_B_HASH: ${AGENT_NODE_KEY_B_HASH:-}
      AGENT_NODE_B_DB_PASSWORD: ${AGENT_NODE_B_DB_PASSWORD:-}
      ETCD_NODE_B_PASSWORD: ${ETCD_NODE_B_PASSWORD:-}
      AGENT_NODE_KEY_C: ${AGENT_NODE_KEY_C:-}
      AGENT_NODE_KEY_C_HASH: ${AGENT_NODE_KEY_C_HASH:-}
      AGENT_NODE_C_DB_PASSWORD: ${AGENT_NODE_C_DB_PASSWORD:-}
      ETCD_NODE_C_PASSWORD: ${ETCD_NODE_C_PASSWORD:-}
      CODEX_MODEL: ${CODEX_MODEL:-kimi/kimi-k2.7-code}
      # 保留生成器对网关/直连互斥及连接参数的检查。
      CODEX_BASE_URL: ${CODEX_BASE_URL:-}
      CODEX_API_KEY: ${CODEX_API_KEY:-}
      AGENT_GATEWAY_URL: ${AGENT_GATEWAY_URL:-}
      AGENT_GATEWAY_PORT: ${AGENT_GATEWAY_PORT:-}
      AGENT_BUDGET_DAILY_TOKENS: ${AGENT_BUDGET_DAILY_TOKENS:-}
      AGENT_GATEWAY_DAILY_TOKENS: ${AGENT_GATEWAY_DAILY_TOKENS:-}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-}
  migrate:
    build: *agent-build
    image: codex-agent:current
    restart: "no"
    user: "0:1000"
    cap_drop: [ALL]
    cap_add: [FOWNER, DAC_READ_SEARCH]
    security_opt: ["no-new-privileges:true"]
    command: ["sh", "-ec", "node scripts/cluster-migrate.mjs && npm run -s agent:init && node scripts/compose-init.mjs copy-identities && node scripts/admin-bootstrap.mjs"]
    environment:
      AGENT_ADMIN_BOOTSTRAP: ${AGENT_ADMIN_BOOTSTRAP:-}
      AGENT_CLUSTER_NODES: ${AGENT_CLUSTER_NODES-node-a}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      AGENT_NODE_A_DB_PASSWORD: ${AGENT_NODE_A_DB_PASSWORD:-}
      AGENT_NODE_B_DB_PASSWORD: ${AGENT_NODE_B_DB_PASSWORD:-}
      AGENT_NODE_C_DB_PASSWORD: ${AGENT_NODE_C_DB_PASSWORD:-}
      AGENT_DEFINITION: ${AGENT_DEFINITION:-agents/writing/agent.json}
    volumes:
      - type: bind
        source: ./.env
        target: ${CONTAINER_APP_DIR}/.env
        read_only: true
        bind: { create_host_path: false }
      - "./nodes:/prepare-nodes"
      - "./nodes/node-a/.data:${CONTAINER_APP_DIR}/.data"
      - "./nodes/node-a/workspace:${CONTAINER_APP_DIR}/workspace"
    depends_on:
      prepare: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      etcd-init: { condition: service_completed_successfully }
  postgres:
    <<: *runtime
    image: postgres:16
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:-}
      POSTGRES_DB: agent
    # 默认只发布 Caddy；remote-access profile 才开启回环隧道入口。
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      prepare: { condition: service_completed_successfully }
  redis:
    <<: *runtime
    image: redis:7.4
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD:-}"]
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:-}
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      prepare: { condition: service_completed_successfully }
  gateway:
    <<: *runtime
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-256m}
    # 网关访问密钥用于校验调用者；长期服务中只有网关接收服务商密钥。
    environment: *gateway-env
    tmpfs: ["/app/data:uid=1000,gid=0,mode=0770"]
    group_add: ["1000"]
    volumes: ["./.data/gateway:/gateway-config:ro"]
    # 官方入口：https://github.com/maximhq/bifrost/blob/transports/v2.4.0/transports/Dockerfile
    entrypoint: ["/bin/sh", "-ec", "cp /gateway-config/config.json /gateway-config/model-parameters.json /app/data/; exec /app/docker-entrypoint.sh /app/main"]
    depends_on:
      prepare: { condition: service_completed_successfully, restart: true }
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  etcd-init:
    build: *agent-build
    user: "1000:1000"
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    image: codex-agent:current
    restart: "no"
    command: ["node", "scripts/etcd-init.mjs"]
    environment:
      ETCD_ENDPOINT: http://etcd:2379
      AGENT_CLUSTER_NODES: ${AGENT_CLUSTER_NODES-node-a}
      ETCD_ROOT_PASSWORD: ${ETCD_ROOT_PASSWORD:-}
      ETCD_HEALTH_PASSWORD: ${ETCD_HEALTH_PASSWORD:-}
      ETCD_NODE_A_PASSWORD: ${ETCD_NODE_A_PASSWORD:-}
      ETCD_NODE_B_PASSWORD: ${ETCD_NODE_B_PASSWORD:-}
      ETCD_NODE_C_PASSWORD: ${ETCD_NODE_C_PASSWORD:-}
    depends_on:
      prepare: { condition: service_completed_successfully }
      etcd: { condition: service_started }
  node-a: &node
    <<: *runtime
    build: *agent-build
    image: codex-agent:current
    user: "0:1000"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER]
    security_opt: ["no-new-privileges:true"]
    extra_hosts: ["host.docker.internal:${REMOTE_BRIDGE_GATEWAY:-172.29.18.1}"]
    init: true
    mem_limit: ${AGENT_MEMORY_LIMIT:-768m}
    environment: &node-env
      AGENT_PREVIEW_SECRET: ${AGENT_PREVIEW_SECRET:-}
      # All nodes trust the public entry origin, not their internal listening port.
      AGENT_ALLOWED_ORIGINS: ${AGENT_ALLOWED_ORIGINS:-http://127.0.0.1:${AGENT_PORT:-4317},http://localhost:${AGENT_PORT:-4317}}
      AGENT_CLUSTER_NODES: ${AGENT_CLUSTER_NODES-node-a}
      AGENT_NODE_KEY: ${AGENT_NODE_KEY_A:-}
      AGENT_NODE_KEY_A_HASH: ${AGENT_NODE_KEY_A_HASH:-}
      AGENT_NODE_KEY_B_HASH: ${AGENT_NODE_KEY_B_HASH:-}
      AGENT_NODE_KEY_C_HASH: ${AGENT_NODE_KEY_C_HASH:-}
      AGENT_BACKUP_KEEP: ${AGENT_BACKUP_KEEP:-7}
      AGENT_REPLICATION_RATE_LIMIT: ${AGENT_REPLICATION_RATE_LIMIT:-0}
      AGENT_REQUEST_TIMEOUT_MS: ${AGENT_REQUEST_TIMEOUT_MS:-30000}
      AGENT_TRANSFER_MAX_BYTES: ${AGENT_TRANSFER_MAX_BYTES:-1073741824}
      AGENT_SHARD_STRATEGY: ${AGENT_SHARD_STRATEGY:-slots}
      AGENT_RUNTIME_LIMIT: ${AGENT_RUNTIME_LIMIT:-4}
      AGENT_NODE_ADDRESS: ${AGENT_NODE_ADDRESS_A:-http://node-a:4340}
      AGENT_NODE_ID: node-a
      ETCD_ENDPOINT: http://etcd:2379
      ETCD_USERNAME: node-a
      ETCD_PASSWORD: ${ETCD_NODE_A_PASSWORD:-}
      AGENT_DEPLOYED: "true"
      AGENT_LISTEN_HOST: 0.0.0.0
      AGENT_PORT: "4340"
      AGENT_GATEWAY_URL: http://gateway:8080/v1
      AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:-}
      DATABASE_URL: postgresql://agent_node_a:${AGENT_NODE_A_DB_PASSWORD:-}@postgres:5432/agent
      REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis:6379/0
      CODEX_MODEL_CATALOG_ENABLED: "true"
      CODEX_MODEL: ${CODEX_MODEL:-kimi/kimi-k2.7-code}
      AGENT_DEFINITION: ${AGENT_DEFINITION:-agents/writing/agent.json}
      AGENT_WEB_SEARCH: ${AGENT_WEB_SEARCH:-auto}
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-2}
      AGENT_MAX_QUEUED: ${AGENT_MAX_QUEUED:-200}
      AGENT_RATE_LIMIT_PER_MINUTE: ${AGENT_RATE_LIMIT_PER_MINUTE:-120}
      AGENT_MAX_SSE: ${AGENT_MAX_SSE:-20}
      AGENT_MEMORY_ENABLED: ${AGENT_MEMORY_ENABLED:-false}
      AGENT_MEMORY_USE: ${AGENT_MEMORY_USE:-true}
      AGENT_MEMORY_GENERATE: ${AGENT_MEMORY_GENERATE:-true}
      AGENT_MEMORY_EXTRACT_MODEL: ${AGENT_MEMORY_EXTRACT_MODEL:-}
      AGENT_MEMORY_CONSOLIDATION_MODEL: ${AGENT_MEMORY_CONSOLIDATION_MODEL:-}
      AGENT_MEMORY_MIN_IDLE_HOURS: ${AGENT_MEMORY_MIN_IDLE_HOURS:-6}
      AGENT_BUDGET_DAILY_TOKENS: ${AGENT_BUDGET_DAILY_TOKENS:-}
      AGENT_BUDGET_MONTHLY_TOKENS: ${AGENT_BUDGET_MONTHLY_TOKENS:-}
      AGENT_BUDGET_DAILY_COST: ${AGENT_BUDGET_DAILY_COST:-}
      AGENT_BUDGET_MONTHLY_COST: ${AGENT_BUDGET_MONTHLY_COST:-}
      AGENT_BUDGET_TIMEZONE: ${AGENT_BUDGET_TIMEZONE:-}
      AGENT_BUDGET_DOWNGRADE_AT: ${AGENT_BUDGET_DOWNGRADE_AT:-}
      AGENT_BUDGET_DOWNGRADE_SCENE: ${AGENT_BUDGET_DOWNGRADE_SCENE:-fast}
    # 三个节点分别使用独立宿主目录；节点丢失只让其分片 unavailable。
    # CONTAINER_APP_DIR 与宿主部署目录相同且保持不变。
    # Codex 历史记录的是绝对路径；换成 release/时间戳路径会导致旧会话无法恢复。
    volumes:
      - "./nodes/node-a/.data:${CONTAINER_APP_DIR}/.data"
      - "./.data/gateway:${CONTAINER_APP_DIR}/.data/gateway"
      - "./nodes/node-a/.runs:${CONTAINER_APP_DIR}/.runs"
      - "./nodes/node-a/workspace:${CONTAINER_APP_DIR}/workspace"
      - "./backups/node-a:${CONTAINER_APP_DIR}/backups"
    depends_on:
      migrate: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      gateway: { condition: service_healthy }
      etcd: { condition: service_healthy }
      etcd-init: { condition: service_completed_successfully }
    healthcheck:
      test: ["CMD", "node", "deploy/ready.mjs", "--alive"]
      interval: 5s
      timeout: 10s
      retries: 20
  node-b:
    profiles: ["cluster"]
    <<: *node
    volumes:
      - "./nodes/node-b/.data:${CONTAINER_APP_DIR}/.data"
      - "./.data/gateway:${CONTAINER_APP_DIR}/.data/gateway"
      - "./nodes/node-b/.runs:${CONTAINER_APP_DIR}/.runs"
      - "./nodes/node-b/workspace:${CONTAINER_APP_DIR}/workspace"
      - "./backups/node-b:${CONTAINER_APP_DIR}/backups"
    environment:
      <<: *node-env
      AGENT_NODE_KEY: ${AGENT_NODE_KEY_B:-}
      AGENT_NODE_ADDRESS: ${AGENT_NODE_ADDRESS_B:-http://node-b:4341}
      AGENT_NODE_ID: node-b
      ETCD_USERNAME: node-b
      ETCD_PASSWORD: ${ETCD_NODE_B_PASSWORD:-}
      AGENT_PORT: "4341"
      DATABASE_URL: postgresql://agent_node_b:${AGENT_NODE_B_DB_PASSWORD:-}@postgres:5432/agent
  node-c:
    profiles: ["cluster"]
    <<: *node
    volumes:
      - "./nodes/node-c/.data:${CONTAINER_APP_DIR}/.data"
      - "./.data/gateway:${CONTAINER_APP_DIR}/.data/gateway"
      - "./nodes/node-c/.runs:${CONTAINER_APP_DIR}/.runs"
      - "./nodes/node-c/workspace:${CONTAINER_APP_DIR}/workspace"
      - "./backups/node-c:${CONTAINER_APP_DIR}/backups"
    environment:
      <<: *node-env
      AGENT_NODE_KEY: ${AGENT_NODE_KEY_C:-}
      AGENT_NODE_ADDRESS: ${AGENT_NODE_ADDRESS_C:-http://node-c:4342}
      AGENT_NODE_ID: node-c
      ETCD_USERNAME: node-c
      ETCD_PASSWORD: ${ETCD_NODE_C_PASSWORD:-}
      AGENT_PORT: "4342"
      DATABASE_URL: postgresql://agent_node_c:${AGENT_NODE_C_DB_PASSWORD:-}@postgres:5432/agent
  etcd:
    <<: *runtime
    image: quay.io/coreos/etcd:v3.7.3@sha256:8d1b6c24f08e12ed7623d1df421832b3cafabe221aa6b658b97288d07807582f
    mem_limit: 128m
    command: ["etcd", "--name=etcd", "--data-dir=/etcd-data", "--listen-client-urls=http://0.0.0.0:2379", "--advertise-client-urls=http://etcd:2379", "--listen-peer-urls=http://0.0.0.0:2380", "--initial-advertise-peer-urls=http://etcd:2380", "--initial-cluster=etcd=http://etcd:2380"]
    volumes: ["etcd-data:/etcd-data"]
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "--user", "health:${ETCD_HEALTH_PASSWORD:-}", "endpoint", "health"]
      interval: 5s
      timeout: 3s
      retries: 10
    depends_on:
      prepare: { condition: service_completed_successfully }
  caddy:
    <<: *runtime
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    mem_limit: 64m
    ports: ["127.0.0.1:${AGENT_PORT:-4317}:80"]
    extra_hosts: ["host.docker.internal:${REMOTE_BRIDGE_GATEWAY:-172.29.18.1}"]
    environment:
      AGENT_CLUSTER_NODES: ${AGENT_CLUSTER_NODES-node-a}
      NODE_B_UPSTREAM: ${NODE_B_UPSTREAM:-node-b:4341}
    entrypoint: ["/bin/sh", "/etc/caddy/caddy-upstreams.sh"]
    volumes: ["./web:/srv/ui:ro", "./deploy/Caddyfile:/etc/caddy/Caddyfile:ro", "./deploy/caddy-upstreams.sh:/etc/caddy/caddy-upstreams.sh:ro"]
    depends_on:
      node-a: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 5s
      timeout: 10s
      retries: 20
  edge:
    <<: *runtime
    profiles: [https]
    image: caddy:2.10.2-alpine@sha256:4c6e91c6ed0e2fa03efd5b44747b625fec79bc9cd06ac5235a779726618e530d
    mem_limit: 64m
    # 唯一公网端口例外：用户主动填写域名、启用 https profile 后才开放。
    ports:
      - "0.0.0.0:80:80"
      - "0.0.0.0:443:443"
    environment:
      AGENT_DOMAIN: ${AGENT_DOMAIN:-}
      AGENT_TLS: ${AGENT_TLS:-}
    entrypoint: ["/bin/sh", "/etc/caddy/edge-entrypoint.sh"]
    volumes:
      - "./deploy/Caddyfile.edge:/etc/caddy/Caddyfile:ro"
      - "./deploy/edge-entrypoint.sh:/etc/caddy/edge-entrypoint.sh:ro"
      - "edge-data:/data"
      - "edge-config:/config"
    depends_on:
      caddy: { condition: service_healthy }
  remote-access:
    <<: *runtime
    profiles: [remote-access]
    image: codex-agent:current
    user: "1000:1000"
    mem_limit: 64m
    command: ["node", "deploy/tcp-relay.mjs"]
    environment:
      RELAY_BIND: 0.0.0.0
      RELAYS: '[[2379,"etcd",2379],[5432,"postgres",5432],[6379,"redis",6379],[8080,"gateway",8080],[4340,"node-a",4340],[4342,"node-c",4342]]'
    ports:
      - "127.0.0.1:12379:2379"
      - "127.0.0.1:15432:5432"
      - "127.0.0.1:16379:6379"
      - "127.0.0.1:18080:8080"
      - "127.0.0.1:14340:4340"
      - "127.0.0.1:14342:4342"
  remote-node-link:
    <<: *runtime
    profiles: [remote-access]
    image: codex-agent:current
    user: "1000:1000"
    mem_limit: 64m
    network_mode: host
    command: ["node", "deploy/tcp-relay.mjs"]
    environment:
      RELAY_BIND: ${REMOTE_BRIDGE_GATEWAY:-172.29.18.1}
      RELAYS: '[[4341,"127.0.0.1",14341]]'
networks:
  default:
    ipam:
      config:
        - subnet: ${REMOTE_BRIDGE_SUBNET:-172.29.18.0/24}
          gateway: ${REMOTE_BRIDGE_GATEWAY:-172.29.18.1}
volumes:
  etcd-data:
  postgres-data:
  redis-data:
  edge-data:
  edge-config:
