<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>产品流程巡查</title>
<style>
*{box-sizing:border-box}body{margin:0;font:15px/1.55 system-ui,sans-serif;color:#1f2328;background:#f7f7f8}header,footer,aside,article{background:white}header,footer{padding:12px 24px;display:flex;align-items:center;gap:12px;border-bottom:1px solid #ddd}header strong{margin-right:auto}button,input,textarea{font:inherit}button{border:1px solid #cbd0d7;background:white;color:inherit;border-radius:6px;padding:5px 12px;cursor:pointer}button[aria-pressed=true],button.active{background:#eef2ff;border-color:#3b5bdb;color:#2742a6}button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid #3b5bdb}body{height:100dvh;display:grid;grid-template-rows:auto minmax(0,1fr) auto}.workspace{display:grid;grid-template-columns:minmax(160px,220px) minmax(0,1fr);min-height:0}aside{border-right:1px solid #ddd;padding:20px 12px;overflow:auto}aside button{width:100%;text-align:left;border-color:transparent;margin-bottom:3px}main{overflow:auto;padding:20px clamp(14px,3vw,48px)}h1{font-size:24px}h2{font-size:18px;margin:0}h3{font-size:15px}article,.group-feedback{margin:0 0 18px;border:1px solid #dce0e5;border-radius:8px;padding:18px}.screen{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(240px,1fr);gap:20px}.shot{display:block;width:100%;padding:0;line-height:0;overflow:hidden}.shot img,dialog img{max-width:100%;height:auto}textarea{width:100%;min-height:74px;padding:8px;border:1px solid #bcc3cd;border-radius:5px;resize:vertical}.marks{display:flex;gap:6px;flex-wrap:wrap}summary{cursor:pointer;color:#384770}.muted,small{color:#555e69}.group-feedback{background:white}footer{border-top:1px solid #ddd;border-bottom:0;flex-wrap:wrap}footer span:last-child{margin-left:auto}blockquote{margin:6px 0;padding-left:12px;border-left:3px solid #ccd3de;white-space:pre-wrap}dialog{max-width:95vw;max-height:94vh;border:1px solid #ccc;border-radius:8px}dialog img{display:block;max-height:80vh;object-fit:contain}label{display:block;margin:8px 0}.unavailable{padding:24px;border:1px dashed #c0c5ce;color:#704e10}.warn{color:#982020}ol,ul{padding-left:22px}details{margin:10px 0}
@media(max-width:850px){.screen{grid-template-columns:1fr}.workspace{grid-template-columns:minmax(110px,26%) 1fr}header,footer{padding:8px 10px}button{padding:5px 8px}}@media(max-width:520px){header{flex-wrap:wrap}main{padding:10px}article{padding:10px}}
</style></head><body>
<header><strong id="title"></strong></header>
<div class="workspace"><aside aria-label="流程目录" id="nav"></aside><main id="view"></main></div>
<footer><span id="counts"></span><button id="md">导出 Markdown</button><button id="json">导出 JSON</button><button id="summary">汇总与验收</button><span id="saved" role="status"></span></footer>
<dialog id="zoom"><button id="close">关闭大图</button><img alt="当前页面截图"></dialog>
<script type="application/json" id="record">REVIEW_DATA</script>
<script>REVIEW_CLIENT</script></body></html>
