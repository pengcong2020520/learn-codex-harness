<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Agent 对话</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div id="notice" role="alert" hidden></div>
  <main id="login-view" class="login">
    <form id="login-form" class="login-card" method="post" action="/ui/">
      <p class="eyebrow">AGENT</p><h1>登录并开始对话</h1>
      <p class="muted">使用你的账号连接 Agent 服务。</p>
      <label for="username">用户名</label><input id="username" name="username" autocomplete="username" required maxlength="200">
      <label for="password">密码</label><input id="password" name="password" type="password" autocomplete="current-password" required>
      <button type="submit">登录</button>
    </form>
  </main>
  <main id="chat-view" class="shell" hidden>
    <aside id="sidebar" aria-label="会话列表">
      <div class="sidebar-heading"><strong>我的会话</strong><button id="close-sidebar" class="mobile-only secondary" aria-label="收起会话列表">收起</button></div>
      <button id="new-session">新建会话</button>
      <form id="search-form" role="search"><label class="sr-only" for="search">搜索会话</label><input id="search" type="search" placeholder="搜索会话"><button class="secondary" type="submit">搜索</button></form>
      <nav id="sessions" aria-label="选择会话"></nav>
      <div class="account"><span id="username-display"></span><button id="benefits" class="secondary">我的权益与用量</button><button id="logout" class="secondary">登出</button></div>
    </aside>
    <section class="conversation" aria-label="对话">
      <header><button id="toggle-sidebar" class="mobile-only secondary" aria-label="展开会话列表" aria-controls="sidebar" aria-expanded="false">会话</button><div><h1 id="agent-name">Agent</h1><p id="session-name" class="muted">新建或选择一个会话</p></div><span id="model" class="muted"></span></header>
      <p id="connection" class="banner" role="status" hidden>连接中断，正在重连</p>
      <div id="warnings" class="banner warning" role="status" hidden></div>
      <div id="queue" class="banner warning" hidden><span id="queue-reason"></span><button id="continue-queue" class="secondary">继续</button></div>
      <div id="messages" role="log" aria-label="对话消息" aria-live="polite" aria-relevant="additions text"><p class="empty">从一个问题开始。</p></div>
      <form id="composer"><label class="sr-only" for="message">消息内容</label><textarea id="message" rows="3" placeholder="输入消息…" required disabled></textarea><div class="composer-bottom"><span class="muted">Enter 发送 · Shift+Enter 换行</span><button id="send" type="submit" disabled>发送</button></div></form>
    </section>
  </main>
  <dialog id="plan-dialog" aria-labelledby="plan-title"><div class="sidebar-heading"><h2 id="plan-title">我的权益与用量</h2><button id="close-plan" class="secondary">关闭</button></div><div id="plan-content"></div></dialog>
</body>
</html>
