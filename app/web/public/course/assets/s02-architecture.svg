<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">S02 总架构：让同一段对话继续下去</title><desc id="desc">增加输入排队与会话恢复；每轮只发送新输入，历史由 Codex 保管。 蓝色为我们的程序，绿色为 Codex 原生能力，橙色突出本阶段新增机制。上方展示请求与返回方向，下方展开职责和数据归属。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#33658A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34B38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#296E62" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#FAFAF7" stroke="#FAFAF7" stroke-width="1.5"/>
<rect x="48" y="40" width="80" height="32" rx="8" fill="#B34B38" stroke="#B34B38" stroke-width="1.5"/>
<text x="88" y="62" font-size="18" fill="#FFFFFF" font-weight="650" text-anchor="middle">S02</text>
<text x="148" y="63" font-size="21" fill="#617079" font-weight="400" text-anchor="start">冲量 AI  /  云端 Agent 脚手架</text>
<text x="48" y="128" font-size="46" fill="#202C35" font-weight="700" text-anchor="start">让同一段对话继续下去</text>
<text x="48" y="174" font-size="26" fill="#617079" font-weight="400" text-anchor="start">增加输入排队与会话恢复；每轮只发送新输入，历史由 Codex 保管。</text>
<rect x="48" y="204" width="134" height="32" rx="8" fill="#EEF5FA" stroke="#EEF5FA" stroke-width="1.5"/>
<text x="115" y="226" font-size="18" fill="#33658A" font-weight="650" text-anchor="middle">我们的程序</text>
<rect x="198" y="204" width="172" height="32" rx="8" fill="#EDF6F1" stroke="#EDF6F1" stroke-width="1.5"/>
<text x="284" y="226" font-size="18" fill="#296E62" font-weight="650" text-anchor="middle">Codex 原生能力</text>
<rect x="386" y="204" width="142" height="32" rx="8" fill="#FFF0E9" stroke="#FFF0E9" stroke-width="1.5"/>
<text x="457" y="226" font-size="18" fill="#B34B38" font-weight="650" text-anchor="middle">本阶段新增</text>
<text x="1552" y="226" font-size="20" fill="#617079" font-weight="400" text-anchor="end">实线：请求 / 调用     虚线：事件 / 结果</text>
<rect x="48" y="280" width="180" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="138" y="324" font-size="30" fill="#202C35" font-weight="500" text-anchor="middle">用户</text>
<text x="138" y="370" font-size="23" fill="#617079" font-weight="500" text-anchor="middle">连续输入</text>
<text x="138" y="408" font-size="21" fill="#617079" font-weight="500" text-anchor="middle">多条消息</text>
<rect x="308" y="280" width="500" height="184" rx="16" fill="#EEF5FA" stroke="#ADC6D8" stroke-width="1.5"/>
<text x="336" y="324" font-size="30" fill="#33658A" font-weight="650" text-anchor="start">多轮客户端</text>
<text x="336" y="372" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">FIFO 排队：上一轮结束再发下一条</text>
<text x="336" y="410" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">复用 Thread，按 Turn 匹配事件</text>
<rect x="920" y="280" width="350" height="184" rx="16" fill="#EDF6F1" stroke="#ADCFC4" stroke-width="1.5"/>
<text x="948" y="324" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">Codex App Server</text>
<text x="948" y="372" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">复用同一个 Thread</text>
<text x="948" y="410" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">原生历史提供上下文</text>
<rect x="1380" y="280" width="172" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1466" y="324" font-size="27" fill="#202C35" font-weight="500" text-anchor="middle">模型服务</text>
<text x="1466" y="372" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">理解上下文</text>
<text x="1466" y="410" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">判断下一步</text>
<path d="M228,350 L306,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M308,396 L230,396" fill="none" stroke="#33658A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="268" y="337" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">输入</text>
<text x="268" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">结果</text>
<path d="M808,350 L918,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M920,396 L810,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="864" y="331" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">JSON-RPC</text>
<text x="864" y="426" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">事件 / 回包</text>
<path d="M1270,350 L1378,350" fill="none" stroke="#296E62" stroke-width="2.5"  marker-end="url(#green)"/>
<path d="M1380,396 L1272,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="1324" y="331" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">模型请求</text>
<text x="1324" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">模型响应</text>
<text x="948" y="490" font-size="19" fill="#617079" font-weight="400" text-anchor="start">本机独立进程 · stdio 通信</text>
<text x="48" y="543" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">比 S01 多出来的，是顺序、复用与恢复</text>
<rect x="48" y="577" width="460" height="323" rx="16" fill="#FFF0E9" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="76" y="623" font-size="29" fill="#B34B38" font-weight="650" text-anchor="start">① 先排队</text>
<text x="76" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">由我们的程序管理</text>
<rect x="76" y="686" width="404" height="44" rx="9" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="96" y="716" font-size="23" fill="#202C35" font-weight="400" text-anchor="start">消息 A  →  本轮执行</text>
<rect x="76" y="745" width="404" height="44" rx="9" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="96" y="775" font-size="23" fill="#202C35" font-weight="400" text-anchor="start">消息 B  →  等待 A 结束</text>
<rect x="76" y="804" width="404" height="44" rx="9" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="96" y="834" font-size="23" fill="#202C35" font-weight="400" text-anchor="start">消息 C  →  等待 B 结束</text>
<rect x="548" y="577" width="460" height="323" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="576" y="623" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">② 复用会话</text>
<text x="576" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">同一个 Thread，每轮有独立 Turn</text>
<text x="576" y="716" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">Turn 1：第一次问答</text>
<text x="576" y="775" font-size="25" fill="#B34B38" font-weight="400" text-anchor="start">Turn 2：只发第二条新输入</text>
<text x="576" y="834" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">Turn 3：继续沿用上下文</text>
<rect x="1048" y="577" width="504" height="323" rx="16" fill="#EDF6F1" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1076" y="623" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">③ 恢复历史</text>
<text x="1076" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">由 Codex 原生保存</text>
<text x="1076" y="707" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">退出后重新进入</text>
<text x="1076" y="752" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">选择已有 Thread</text>
<text x="1076" y="797" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">thread/resume 恢复会话</text>
<text x="1076" y="842" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">继续发送下一轮输入</text>
<path d="M508,745 L546,745" fill="none" stroke="#B34B38" stroke-width="2.5"  marker-end="url(#red)"/>
<path d="M1008,745 L1046,745" fill="none" stroke="#296E62" stroke-width="2.5"  marker-end="url(#green)"/>
<rect x="48" y="934" width="1504" height="67" rx="13" fill="#24333C" stroke="#24333C" stroke-width="1.5"/>
<text x="76" y="977" font-size="27" fill="#FFFFFF" font-weight="550" text-anchor="start">我们的程序管输入顺序；Codex 管上下文。会话恢复不等于长期记忆。</text>
<text x="48" y="1025" font-size="15" fill="#617079" font-weight="650" text-anchor="start">CHONGLIANG AI</text>
<text x="1552" y="1025" font-size="17" fill="#617079" font-weight="400" text-anchor="end">逻辑职责图 · S02 当前阶段实现 · 非云端部署拓扑</text>
</g></svg>
