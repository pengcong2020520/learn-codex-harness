<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">S03 总架构：用配置装配一个能做事的 Agent</title><desc id="desc">增加角色、Skills、工具与资料边界；服务常驻，终端通过 HTTP / SSE 接入。 蓝色为我们的程序，绿色为 Codex 原生能力，橙色突出本阶段新增机制。上方展示请求与返回方向，下方展开职责和数据归属。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#33658A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34B38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#296E62" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#FAFAF7" stroke="#FAFAF7" stroke-width="1.5"/>
<rect x="48" y="40" width="80" height="32" rx="8" fill="#B34B38" stroke="#B34B38" stroke-width="1.5"/>
<text x="88" y="62" font-size="18" fill="#FFFFFF" font-weight="650" text-anchor="middle">S03</text>
<text x="148" y="63" font-size="21" fill="#617079" font-weight="400" text-anchor="start">冲量 AI  /  云端 Agent 脚手架</text>
<text x="48" y="128" font-size="46" fill="#202C35" font-weight="700" text-anchor="start">用配置装配一个能做事的 Agent</text>
<text x="48" y="174" font-size="26" fill="#617079" font-weight="400" text-anchor="start">增加角色、Skills、工具与资料边界；服务常驻，终端通过 HTTP / SSE 接入。</text>
<rect x="48" y="204" width="134" height="32" rx="8" fill="#EEF5FA" stroke="#EEF5FA" stroke-width="1.5"/>
<text x="115" y="226" font-size="18" fill="#33658A" font-weight="650" text-anchor="middle">我们的程序</text>
<rect x="198" y="204" width="172" height="32" rx="8" fill="#EDF6F1" stroke="#EDF6F1" stroke-width="1.5"/>
<text x="284" y="226" font-size="18" fill="#296E62" font-weight="650" text-anchor="middle">Codex 原生能力</text>
<rect x="386" y="204" width="142" height="32" rx="8" fill="#FFF0E9" stroke="#FFF0E9" stroke-width="1.5"/>
<text x="457" y="226" font-size="18" fill="#B34B38" font-weight="650" text-anchor="middle">本阶段新增</text>
<text x="1552" y="226" font-size="20" fill="#617079" font-weight="400" text-anchor="end">实线：请求 / 调用     虚线：事件 / 结果</text>
<rect x="48" y="280" width="180" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="138" y="324" font-size="30" fill="#202C35" font-weight="500" text-anchor="middle">用户</text>
<text x="138" y="370" font-size="23" fill="#617079" font-weight="500" text-anchor="middle">终端客户端</text>
<text x="138" y="408" font-size="21" fill="#617079" font-weight="500" text-anchor="middle">HTTP / SSE</text>
<rect x="308" y="280" width="500" height="184" rx="16" fill="#EEF5FA" stroke="#ADC6D8" stroke-width="1.5"/>
<text x="336" y="324" font-size="30" fill="#33658A" font-weight="650" text-anchor="start">Agent 服务</text>
<text x="336" y="372" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">校验配置，装配角色与工具白名单</text>
<text x="336" y="410" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">管理会话、任务队列和执行事件</text>
<rect x="920" y="280" width="350" height="184" rx="16" fill="#EDF6F1" stroke="#ADCFC4" stroke-width="1.5"/>
<text x="948" y="324" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">Codex App Server</text>
<text x="948" y="372" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">加载原生 Skills</text>
<text x="948" y="410" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">经 MCP 调用本地工具</text>
<rect x="1380" y="280" width="172" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1466" y="324" font-size="27" fill="#202C35" font-weight="500" text-anchor="middle">模型服务</text>
<text x="1466" y="372" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">理解上下文</text>
<text x="1466" y="410" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">判断下一步</text>
<path d="M228,350 L306,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M308,396 L230,396" fill="none" stroke="#33658A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="268" y="337" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">输入</text>
<text x="268" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">结果</text>
<path d="M808,350 L918,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M920,396 L810,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="864" y="331" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">JSON-RPC</text>
<text x="864" y="426" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">事件 / 回包</text>
<path d="M1270,350 L1378,350" fill="none" stroke="#296E62" stroke-width="2.5"  marker-end="url(#green)"/>
<path d="M1380,396 L1272,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="1324" y="331" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">模型请求</text>
<text x="1324" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">模型响应</text>
<text x="948" y="490" font-size="19" fill="#617079" font-weight="400" text-anchor="start">本机独立进程 · stdio 通信</text>
<text x="48" y="543" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">角色说清做什么，Skill 提供方法，工具负责实际执行</text>
<rect x="48" y="577" width="484" height="323" rx="16" fill="#FFF0E9" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="76" y="623" font-size="29" fill="#B34B38" font-weight="650" text-anchor="start">配置：决定怎样工作</text>
<text x="76" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">Agent 定义经过校验后生效</text>
<text x="76" y="710" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">角色：任务与行为边界</text>
<text x="76" y="757" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">Skills：做事的方法说明</text>
<text x="76" y="804" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">工具白名单：允许哪些操作</text>
<text x="76" y="851" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">资料绑定：可读 / 可创建的目录</text>
<rect x="568" y="577" width="484" height="323" rx="16" fill="#FFF0E9" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="596" y="623" font-size="29" fill="#B34B38" font-weight="650" text-anchor="start">执行：把调用变成动作</text>
<text x="596" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">Codex → MCP → 本地 Registry</text>
<text x="596" y="710" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">① 检查工具是否允许</text>
<text x="596" y="757" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">② 校验调用参数</text>
<text x="596" y="804" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">③ 执行读文件 / 写文件 / 搜索</text>
<text x="596" y="851" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">④ 把工具结果交回 Codex</text>
<rect x="1088" y="577" width="464" height="323" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1116" y="623" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">结果：各自保存</text>
<text x="1116" y="659" font-size="21" fill="#617079" font-weight="400" text-anchor="start">文件与会话有不同归属</text>
<text x="1116" y="710" font-size="23" fill="#617079" font-weight="400" text-anchor="start">workspace：资料与生成文件</text>
<text x="1116" y="757" font-size="23" fill="#617079" font-weight="400" text-anchor="start">本地 JSON：业务任务状态</text>
<text x="1116" y="804" font-size="23" fill="#617079" font-weight="400" text-anchor="start">Codex：原生会话与上下文</text>
<text x="1116" y="851" font-size="23" fill="#617079" font-weight="400" text-anchor="start">Skill 不会自动扩大工具权限</text>
<rect x="48" y="934" width="1504" height="67" rx="13" fill="#24333C" stroke="#24333C" stroke-width="1.5"/>
<text x="76" y="977" font-size="27" fill="#FFFFFF" font-weight="550" text-anchor="start">写作助手是测试案例。可复用的是角色、方法、工具与资料边界的装配方式。</text>
<text x="48" y="1025" font-size="15" fill="#617079" font-weight="650" text-anchor="start">CHONGLIANG AI</text>
<text x="1552" y="1025" font-size="17" fill="#617079" font-weight="400" text-anchor="end">逻辑职责图 · S03 当前阶段实现 · 非云端部署拓扑</text>
</g></svg>
