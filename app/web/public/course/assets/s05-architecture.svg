<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">S05 总架构：让知识可用，也让访问有边界</title><desc id="desc">增加可信任务上下文与统一门禁，把原文组织成 Wiki，或按配置使用 RAG。 蓝色为我们的程序，绿色为 Codex 原生能力，橙色突出本阶段新增机制。上方展示请求与返回方向，下方展开职责和数据归属。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#33658A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34B38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#296E62" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#FAFAF7" stroke="#FAFAF7" stroke-width="1.5"/>
<rect x="48" y="40" width="80" height="32" rx="8" fill="#B34B38" stroke="#B34B38" stroke-width="1.5"/>
<text x="88" y="62" font-size="18" fill="#FFFFFF" font-weight="650" text-anchor="middle">S05</text>
<text x="148" y="63" font-size="21" fill="#617079" font-weight="400" text-anchor="start">冲量 AI  /  云端 Agent 脚手架</text>
<text x="48" y="128" font-size="46" fill="#202C35" font-weight="700" text-anchor="start">让知识可用，也让访问有边界</text>
<text x="48" y="174" font-size="26" fill="#617079" font-weight="400" text-anchor="start">增加可信任务上下文与统一门禁，把原文组织成 Wiki，或按配置使用 RAG。</text>
<rect x="48" y="204" width="134" height="32" rx="8" fill="#EEF5FA" stroke="#EEF5FA" stroke-width="1.5"/>
<text x="115" y="226" font-size="18" fill="#33658A" font-weight="650" text-anchor="middle">我们的程序</text>
<rect x="198" y="204" width="172" height="32" rx="8" fill="#EDF6F1" stroke="#EDF6F1" stroke-width="1.5"/>
<text x="284" y="226" font-size="18" fill="#296E62" font-weight="650" text-anchor="middle">Codex 原生能力</text>
<rect x="386" y="204" width="142" height="32" rx="8" fill="#FFF0E9" stroke="#FFF0E9" stroke-width="1.5"/>
<text x="457" y="226" font-size="18" fill="#B34B38" font-weight="650" text-anchor="middle">本阶段新增</text>
<text x="1552" y="226" font-size="20" fill="#617079" font-weight="400" text-anchor="end">实线：请求 / 调用     虚线：事件 / 结果</text>
<rect x="48" y="280" width="180" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="138" y="324" font-size="30" fill="#202C35" font-weight="500" text-anchor="middle">用户</text>
<text x="138" y="370" font-size="23" fill="#617079" font-weight="500" text-anchor="middle">任务 / 维护入口</text>
<text x="138" y="408" font-size="21" fill="#617079" font-weight="500" text-anchor="middle">HTTP / SSE</text>
<rect x="308" y="280" width="500" height="184" rx="16" fill="#EEF5FA" stroke="#ADC6D8" stroke-width="1.5"/>
<text x="336" y="324" font-size="30" fill="#33658A" font-weight="650" text-anchor="start">Agent 服务 + 通用门禁</text>
<text x="336" y="372" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">由服务端签发 Task / Turn 身份</text>
<text x="336" y="410" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">校验工具、资源归属与知识库授权</text>
<rect x="920" y="280" width="350" height="184" rx="16" fill="#EDF6F1" stroke="#ADCFC4" stroke-width="1.5"/>
<text x="948" y="324" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">Codex App Server</text>
<text x="948" y="372" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">组织模型与工具循环</text>
<text x="948" y="410" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">dynamicTools 回调到产品侧</text>
<rect x="1380" y="280" width="172" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1466" y="324" font-size="27" fill="#202C35" font-weight="500" text-anchor="middle">模型服务</text>
<text x="1466" y="372" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">理解上下文</text>
<text x="1466" y="410" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">判断下一步</text>
<path d="M228,350 L306,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M308,396 L230,396" fill="none" stroke="#33658A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
<text x="268" y="337" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">输入</text>
<text x="268" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">结果</text>
<path d="M808,350 L918,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M920,396 L810,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="864" y="331" font-size="18" fill="#33658A" font-weight="500" text-anchor="middle">JSON-RPC</text>
<text x="864" y="426" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">事件 / 回包</text>
<path d="M1270,350 L1378,350" fill="none" stroke="#296E62" stroke-width="2.5"  marker-end="url(#green)"/>
<path d="M1380,396 L1272,396" fill="none" stroke="#296E62" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#green)"/>
<text x="1324" y="331" font-size="18" fill="#296E62" font-weight="500" text-anchor="middle">模型请求</text>
<text x="1324" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">模型响应</text>
<text x="948" y="490" font-size="19" fill="#617079" font-weight="400" text-anchor="start">本机独立进程 · stdio 通信</text>
<text x="48" y="543" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">每次操作先过门禁，再进入相应的知识路径</text>
<rect x="48" y="577" width="1504" height="87" rx="16" fill="#FFF0E9" stroke="#D8A18F" stroke-width="1.5"/>
<text x="76" y="616" font-size="29" fill="#B34B38" font-weight="650" text-anchor="start">统一门禁</text>
<text x="280" y="615" font-size="27" fill="#202C35" font-weight="550" text-anchor="start">服务端可信身份  ∩  工具白名单  ∩  资源归属 / KB 授权  ∩  当前任务范围</text>
<text x="280" y="645" font-size="21" fill="#617079" font-weight="400" text-anchor="start">dynamicTools 回调与 HTTP 操作共用检查；模型填写的身份字段不授予权限。</text>
<path d="M420,664 L420,699" fill="none" stroke="#B34B38" stroke-width="2.5"  marker-end="url(#red)"/>
<path d="M1180,664 L1180,699" fill="none" stroke="#B34B38" stroke-width="2.5"  marker-end="url(#red)"/>
<rect x="48" y="702" width="736" height="148" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="76" y="748" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">Wiki · 默认路径</text>
<text x="76" y="784" font-size="21" fill="#617079" font-weight="400" text-anchor="start">原文 → Codex + Skill 维护 → 修订校验 → 当前有效页面</text>
<text x="76" y="821" font-size="23" fill="#617079" font-weight="400" text-anchor="start">基于来源版本维护；并发修订以版本校验决定能否生效。</text>
<rect x="816" y="702" width="736" height="148" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="844" y="748" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">RAG · 可选路径</text>
<text x="844" y="784" font-size="21" fill="#617079" font-weight="400" text-anchor="start">原文 → 分块 / 向量 + BM25 → 按生效模式检索</text>
<text x="844" y="821" font-size="23" fill="#617079" font-weight="400" text-anchor="start">需要额外配置；索引失败保留旧版本，不自动切换 Wiki。</text>
<text x="48" y="895" font-size="25" fill="#617079" font-weight="400" text-anchor="start">继续复用 S04 的 PG / Redis / 文件；Codex 保存原生历史。挂载知识库时禁用原生记忆。</text>
<rect x="48" y="934" width="1504" height="67" rx="13" fill="#24333C" stroke="#24333C" stroke-width="1.5"/>
<text x="76" y="977" font-size="27" fill="#FFFFFF" font-weight="550" text-anchor="start">模型可以提出操作，但不能授予权限；Wiki 和 RAG 都要保留可追溯的原文依据。</text>
<text x="48" y="1025" font-size="15" fill="#617079" font-weight="650" text-anchor="start">CHONGLIANG AI</text>
<text x="1552" y="1025" font-size="17" fill="#617079" font-weight="400" text-anchor="end">逻辑职责图 · S05 当前阶段实现 · 非云端部署拓扑</text>
</g></svg>
