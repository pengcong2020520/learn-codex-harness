<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="810" viewBox="0 0 1080 810" role="img" aria-labelledby="title desc">
<title id="title">Demo 3 总体架构</title><desc id="desc">产品侧组织任务，独立 Codex 子进程负责模型与原生上下文。红色为本版新增职责。</desc>
<defs><marker id="a" markerWidth="7" markerHeight="7" refX="6" refY="3.5" orient="auto-start-reverse"><path d="M0 0L7 3.5L0 7" fill="#8b9b80"/></marker></defs><rect width="1080" height="810" fill="#fafbf6"/>
<text x="34" y="48" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="27" fill="#31482f" font-weight="600">DEMO 3 / 可配置 Agent：装配与工具</text>
<text x="34" y="83" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="17" fill="#67775d" font-weight="400">红色：本版新增职责  ·  箭头：通信或调用关系  ·  只展示本版已实现能力</text>
<rect x="34" y="117" width="604" height="123" rx="12" fill="#fff5ee" stroke="#bd7155"/>
<text x="55" y="150" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a54f33" font-weight="600">01  交互与任务入口</text>
<text x="55" y="184" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">本地 CLI → HTTP / SSE 服务</text>
<text x="55" y="212" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">产品侧管理会话、排队、任务与事件</text>
<path d="M335 240L335 267" stroke="#8b9b80" stroke-width="2" marker-end="url(#a)" />
<rect x="34" y="270" width="604" height="123" rx="12" fill="#fff5ee" stroke="#bd7155"/>
<text x="55" y="303" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a54f33" font-weight="600">02  Agent 装配层</text>
<text x="55" y="337" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">角色指令 / Skills / 工具白名单 / 执行环境</text>
<text x="55" y="365" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">读取配置并校验；原生 Skills 通过 Codex 加载</text>
<path d="M335 393L335 420" stroke="#8b9b80" stroke-width="2" marker-end="url(#a)" />
<rect x="34" y="423" width="604" height="123" rx="12" fill="#fff5ee" stroke="#bd7155"/>
<text x="55" y="456" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a54f33" font-weight="600">03  工具适配与执行</text>
<text x="55" y="490" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">Codex → 本地 MCP bridge → Tool Registry</text>
<text x="55" y="518" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">工具定义 + 参数校验器 + 执行函数</text>
<path d="M335 546L335 573" stroke="#8b9b80" stroke-width="2" marker-end="url(#a)" />
<rect x="34" y="576" width="604" height="123" rx="12" fill="#fff5ee" stroke="#bd7155"/>
<text x="55" y="609" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="23" fill="#a54f33" font-weight="600">04  工作区与业务状态</text>
<text x="55" y="643" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">文件工具执行路径与符号链接边界校验</text>
<text x="55" y="671" font-family="PingFang SC,Microsoft YaHei,sans-serif" font-size="18" fill="#67775d" font-weight="400">项目 workspace 保存文件；本地 JSON 保存业务状态</text>
