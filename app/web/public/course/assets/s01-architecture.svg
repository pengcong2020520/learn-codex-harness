<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1040" viewBox="0 0 1600 1040" role="img" aria-labelledby="title desc"><title id="title">S01 总架构：先打通一次问答</title><desc id="desc">我们负责发起与验收，Codex 负责调用模型。先让一轮任务完整结束。 蓝色为我们的程序，绿色为 Codex 原生能力，橙色突出本阶段新增机制。上方展示请求与返回方向，下方展开职责和数据归属。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#33658A" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="red" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B34B38" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="green" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#296E62" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif">
<rect x="0" y="0" width="1600" height="1040" rx="0" fill="#FAFAF7" stroke="#FAFAF7" stroke-width="1.5"/>
<rect x="48" y="40" width="80" height="32" rx="8" fill="#B34B38" stroke="#B34B38" stroke-width="1.5"/>
<text x="88" y="62" font-size="18" fill="#FFFFFF" font-weight="650" text-anchor="middle">S01</text>
<text x="148" y="63" font-size="21" fill="#617079" font-weight="400" text-anchor="start">冲量 AI  /  云端 Agent 脚手架</text>
<text x="48" y="128" font-size="46" fill="#202C35" font-weight="700" text-anchor="start">先打通一次问答</text>
<text x="48" y="174" font-size="26" fill="#617079" font-weight="400" text-anchor="start">我们负责发起与验收，Codex 负责调用模型。先让一轮任务完整结束。</text>
<rect x="48" y="204" width="134" height="32" rx="8" fill="#EEF5FA" stroke="#EEF5FA" stroke-width="1.5"/>
<text x="115" y="226" font-size="18" fill="#33658A" font-weight="650" text-anchor="middle">我们的程序</text>
<rect x="198" y="204" width="172" height="32" rx="8" fill="#EDF6F1" stroke="#EDF6F1" stroke-width="1.5"/>
<text x="284" y="226" font-size="18" fill="#296E62" font-weight="650" text-anchor="middle">Codex 原生能力</text>
<rect x="386" y="204" width="142" height="32" rx="8" fill="#FFF0E9" stroke="#FFF0E9" stroke-width="1.5"/>
<text x="457" y="226" font-size="18" fill="#B34B38" font-weight="650" text-anchor="middle">本阶段新增</text>
<text x="1552" y="226" font-size="20" fill="#617079" font-weight="400" text-anchor="end">实线：请求 / 调用     虚线：事件 / 结果</text>
<rect x="48" y="280" width="180" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="138" y="324" font-size="30" fill="#202C35" font-weight="500" text-anchor="middle">用户</text>
<text x="138" y="370" font-size="23" fill="#617079" font-weight="500" text-anchor="middle">终端输入</text>
<text x="138" y="408" font-size="21" fill="#617079" font-weight="500" text-anchor="middle">一个问题</text>
<rect x="308" y="280" width="500" height="184" rx="16" fill="#EEF5FA" stroke="#ADC6D8" stroke-width="1.5"/>
<text x="336" y="324" font-size="30" fill="#33658A" font-weight="650" text-anchor="start">单轮客户端</text>
<text x="336" y="372" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">读取输入，启动本机 Codex</text>
<text x="336" y="410" font-size="25" fill="#202C35" font-weight="400" text-anchor="start">发出请求，匹配事件，核对终态</text>
<rect x="920" y="280" width="350" height="184" rx="16" fill="#EDF6F1" stroke="#ADCFC4" stroke-width="1.5"/>
<text x="948" y="324" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">Codex App Server</text>
<text x="948" y="372" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">组织模型调用</text>
<text x="948" y="410" font-size="24" fill="#202C35" font-weight="400" text-anchor="start">管理会话与本轮上下文</text>
<rect x="1380" y="280" width="172" height="184" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="1466" y="324" font-size="27" fill="#202C35" font-weight="500" text-anchor="middle">模型服务</text>
<text x="1466" y="372" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">理解上下文</text>
<text x="1466" y="410" font-size="22" fill="#617079" font-weight="500" text-anchor="middle">判断下一步</text>
<path d="M228,350 L306,350" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<path d="M308,396 L230,396" fill="none" stroke="#33658A" stroke-width="2.5" stroke-dasharray="7 6" marker-end="url(#arrow)"/>
