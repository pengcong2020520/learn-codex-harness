<text x="1324" y="426" font-size="18" fill="#617079" font-weight="500" text-anchor="middle">模型响应</text>
<text x="948" y="490" font-size="19" fill="#617079" font-weight="400" text-anchor="start">本机独立进程 · stdio 通信</text>
<text x="48" y="543" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">一次请求，沿这五步走完</text>
<rect x="48" y="577" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="70" y="613" font-size="20" fill="#B34B38" font-weight="650" text-anchor="start">01</text>
<text x="70" y="656" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">建立连接</text>
<text x="70" y="696" font-size="20" fill="#617079" font-weight="400" text-anchor="start">启动 App Server</text>
<text x="70" y="727" font-size="20" fill="#617079" font-weight="400" text-anchor="start">initialize → initialized</text>
<path d="M328,665 L352,665" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="354" y="577" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="376" y="613" font-size="20" fill="#B34B38" font-weight="650" text-anchor="start">02</text>
<text x="376" y="656" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">建立会话</text>
<text x="376" y="696" font-size="20" fill="#617079" font-weight="400" text-anchor="start">thread/start</text>
<text x="376" y="727" font-size="20" fill="#617079" font-weight="400" text-anchor="start">得到 Thread ID</text>
<path d="M634,665 L658,665" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="660" y="577" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="682" y="613" font-size="20" fill="#B34B38" font-weight="650" text-anchor="start">03</text>
<text x="682" y="656" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">开始本轮</text>
<text x="682" y="696" font-size="20" fill="#617079" font-weight="400" text-anchor="start">turn/start</text>
<text x="682" y="727" font-size="20" fill="#617079" font-weight="400" text-anchor="start">发送用户输入</text>
<path d="M940,665 L964,665" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="966" y="577" width="280" height="180" rx="16" fill="#FFFFFF" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="988" y="613" font-size="20" fill="#B34B38" font-weight="650" text-anchor="start">04</text>
<text x="988" y="656" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">接收过程</text>
<text x="988" y="696" font-size="20" fill="#617079" font-weight="400" text-anchor="start">文本片段 / 状态通知</text>
<text x="988" y="727" font-size="20" fill="#617079" font-weight="400" text-anchor="start">匹配 Thread + Turn</text>
<path d="M1246,665 L1270,665" fill="none" stroke="#33658A" stroke-width="2.5"  marker-end="url(#arrow)"/>
<rect x="1272" y="577" width="280" height="180" rx="16" fill="#FFF0E9" stroke="#D8A18F" stroke-width="1.5"/>
<text x="1294" y="613" font-size="20" fill="#B34B38" font-weight="650" text-anchor="start">05</text>
<text x="1294" y="656" font-size="29" fill="#202C35" font-weight="650" text-anchor="start">检查终态</text>
<text x="1294" y="696" font-size="20" fill="#617079" font-weight="400" text-anchor="start">turn/completed</text>
<text x="1294" y="727" font-size="20" fill="#617079" font-weight="400" text-anchor="start">确认 status = completed</text>
<rect x="48" y="785" width="736" height="115" rx="16" fill="#EEF5FA" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="76" y="831" font-size="29" fill="#33658A" font-weight="650" text-anchor="start">我们的程序保存</text>
<text x="76" y="867" font-size="21" fill="#617079" font-weight="400" text-anchor="start">运行日志 .runs；失败或超时必须如实返回</text>
<rect x="816" y="785" width="736" height="115" rx="16" fill="#EDF6F1" stroke="#D9E1E3" stroke-width="1.5"/>
<text x="844" y="831" font-size="29" fill="#296E62" font-weight="650" text-anchor="start">Codex 保存</text>
<text x="844" y="867" font-size="21" fill="#617079" font-weight="400" text-anchor="start">原生会话状态 .data/codex；本阶段不开放工具</text>
<rect x="48" y="934" width="1504" height="67" rx="13" fill="#24333C" stroke="#24333C" stroke-width="1.5"/>
<text x="76" y="977" font-size="27" fill="#FFFFFF" font-weight="550" text-anchor="start">收到回包 ≠ 已经答完；只有本轮成功结束，才能交付答案。</text>
<text x="48" y="1025" font-size="15" fill="#617079" font-weight="650" text-anchor="start">CHONGLIANG AI</text>
<text x="1552" y="1025" font-size="17" fill="#617079" font-weight="400" text-anchor="end">逻辑职责图 · S01 当前阶段实现 · 非云端部署拓扑</text>
</g></svg>
