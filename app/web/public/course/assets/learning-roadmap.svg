<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1226" viewBox="0 0 1600 1226" role="img" aria-labelledby="title desc"><title id="title">学习路线：亲手做一个云端 Agent</title><desc id="desc">s00 到 s11 分四组：跑起来、变成服务、装配 Agent、上生产；s12 到 s17 为第五组：走向生产，s12 开发中，s13 到 s17 规划中。</desc><defs><marker id="arrow-4A7BB7" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#4A7BB7" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-3E8A5E" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#3E8A5E" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-D9622B" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D9622B" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-7A54A8" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#7A54A8" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-B8C0C6" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#B8C0C6" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="arrow-9AA5B1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#9AA5B1" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect width="1600" height="1226" fill="#FBFBF9"/><text x="48" y="70" font-size="32" fill="#1F2933" font-weight="700" text-anchor="start">学习路线：亲手做一个云端 Agent</text><text x="48" y="108" font-size="18" fill="#6B7780" font-weight="400" text-anchor="start">每个阶段只多一个单元，都是可以独立运行和测试的真实代码；从 Codex 现成的 harness 出发，不自造 agent loop。</text><rect x="48" y="150" width="196" height="132" rx="16" fill="#EAF2FB" stroke="#4A7BB7" stroke-width="1.6"/><rect x="48" y="168" width="5" height="96" rx="2.5" fill="#4A7BB7"/><text x="72" y="192" font-size="14" fill="#24507F" font-weight="600" text-anchor="start">阶段 1</text><text x="72" y="224" font-size="24" fill="#24507F" font-weight="700" text-anchor="start">跑起来</text><text x="72" y="252" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">先让 Codex 干活</text><rect x="270" y="168" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#4A7BB7" stroke-width="1.6"/><rect x="288" y="186" width="48" height="26" rx="8" fill="#4A7BB7" stroke="none" stroke-width="1.6"/><text x="312" y="204" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s00</text><text x="348" y="205" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">先体验</text><text x="288" y="242" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">用 SDK 交给 Codex 一个任务</text><path d="M682.6666666666667,216 L700.6666666666667,216" fill="none" stroke="#4A7BB7" stroke-width="2.2" marker-end="url(#arrow-4A7BB7)"/><rect x="706.6666666666667" y="168" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#4A7BB7" stroke-width="1.6"/><rect x="724.6666666666667" y="186" width="48" height="26" rx="8" fill="#4A7BB7" stroke="none" stroke-width="1.6"/><text x="748.6666666666667" y="204" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s01</text><text x="784.6666666666667" y="205" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">单轮问答</text><text x="724.6666666666667" y="242" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">接上模型，直接说 App Server 协议</text><path d="M1119.3333333333335,216 L1137.3333333333335,216" fill="none" stroke="#4A7BB7" stroke-width="2.2" marker-end="url(#arrow-4A7BB7)"/><rect x="1143.3333333333335" y="168" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#4A7BB7" stroke-width="1.6"/><rect x="1161.3333333333335" y="186" width="48" height="26" rx="8" fill="#4A7BB7" stroke="none" stroke-width="1.6"/><text x="1185.3333333333335" y="204" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s02</text><text x="1221.3333333333335" y="205" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">多轮会话</text><text x="1161.3333333333335" y="242" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">同一个 Thread 接着聊</text><path d="M1347.6666666666667,268 L1347.6666666666667,294 L583.5,294 L583.5,318" fill="none" stroke="#9AA5B1" stroke-width="2.2" marker-end="url(#arrow-9AA5B1)"/><rect x="48" y="306" width="196" height="132" rx="16" fill="#EAF5EE" stroke="#3E8A5E" stroke-width="1.6"/><rect x="48" y="324" width="5" height="96" rx="2.5" fill="#3E8A5E"/><text x="72" y="348" font-size="14" fill="#24603D" font-weight="600" text-anchor="start">阶段 2</text><text x="72" y="380" font-size="24" fill="#24603D" font-weight="700" text-anchor="start">变成服务</text><text x="72" y="408" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">客户端随时来去</text><rect x="270" y="324" width="627" height="96" rx="14" fill="#FFFFFF" stroke="#3E8A5E" stroke-width="1.6"/><rect x="288" y="342" width="48" height="26" rx="8" fill="#3E8A5E" stroke="none" stroke-width="1.6"/><text x="312" y="360" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s03</text><text x="348" y="361" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">服务化</text><text x="288" y="398" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">服务端常驻，关掉客户端照样跑完</text><path d="M901,372 L919,372" fill="none" stroke="#3E8A5E" stroke-width="2.2" marker-end="url(#arrow-3E8A5E)"/><rect x="925" y="324" width="627" height="96" rx="14" fill="#FFFFFF" stroke="#3E8A5E" stroke-width="1.6"/><rect x="943" y="342" width="48" height="26" rx="8" fill="#3E8A5E" stroke="none" stroke-width="1.6"/><text x="967" y="360" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s04</text><text x="1003" y="361" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">事件与消息</text><text x="943" y="398" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">服务端排队，状态经 SSE 推送</text><path d="M1238.5,424 L1238.5,450 L474.33333333333337,450 L474.33333333333337,474" fill="none" stroke="#9AA5B1" stroke-width="2.2" marker-end="url(#arrow-9AA5B1)"/><rect x="48" y="462" width="196" height="132" rx="16" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.6"/><rect x="48" y="480" width="5" height="96" rx="2.5" fill="#D9622B"/><text x="72" y="504" font-size="14" fill="#9A3F14" font-weight="600" text-anchor="start">阶段 3</text><text x="72" y="536" font-size="24" fill="#9A3F14" font-weight="700" text-anchor="start">装配 Agent</text><text x="72" y="564" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">它是谁、能做什么</text><rect x="270" y="480" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#D9622B" stroke-width="1.6"/><rect x="288" y="498" width="48" height="26" rx="8" fill="#D9622B" stroke="none" stroke-width="1.6"/><text x="312" y="516" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s05</text><text x="348" y="517" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">Agent 装配</text><text x="288" y="554" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">一份 JSON 决定角色与 Skills</text><path d="M682.6666666666667,528 L700.6666666666667,528" fill="none" stroke="#D9622B" stroke-width="2.2" marker-end="url(#arrow-D9622B)"/><rect x="706.6666666666667" y="480" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#D9622B" stroke-width="1.6"/><rect x="724.6666666666667" y="498" width="48" height="26" rx="8" fill="#D9622B" stroke="none" stroke-width="1.6"/><text x="748.6666666666667" y="516" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s06</text><text x="784.6666666666667" y="517" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">工具</text><text x="724.6666666666667" y="554" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">白名单、资料边界、MCP 回调</text><path d="M1119.3333333333335,528 L1137.3333333333335,528" fill="none" stroke="#D9622B" stroke-width="2.2" marker-end="url(#arrow-D9622B)"/><rect x="1143.3333333333335" y="480" width="408.6666666666667" height="96" rx="14" fill="#FFFFFF" stroke="#D9622B" stroke-width="1.6"/><rect x="1161.3333333333335" y="498" width="48" height="26" rx="8" fill="#D9622B" stroke="none" stroke-width="1.6"/><text x="1185.3333333333335" y="516" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s07</text><text x="1221.3333333333335" y="517" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">记忆</text><text x="1161.3333333333335" y="554" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">Codex 提炼，服务端管控</text><path d="M1347.6666666666667,580 L1347.6666666666667,606 L419.75,606 L419.75,630" fill="none" stroke="#9AA5B1" stroke-width="2.2" marker-end="url(#arrow-9AA5B1)"/><rect x="48" y="618" width="196" height="132" rx="16" fill="#F3EEF8" stroke="#7A54A8" stroke-width="1.6"/><rect x="48" y="636" width="5" height="96" rx="2.5" fill="#7A54A8"/><text x="72" y="660" font-size="14" fill="#4F2E7A" font-weight="600" text-anchor="start">阶段 4</text><text x="72" y="692" font-size="24" fill="#4F2E7A" font-weight="700" text-anchor="start">上生产</text><text x="72" y="720" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">靠得住、守得住</text><rect x="270" y="636" width="299.5" height="96" rx="14" fill="#FFFFFF" stroke="#7A54A8" stroke-width="1.6"/><rect x="288" y="654" width="48" height="26" rx="8" fill="#7A54A8" stroke="none" stroke-width="1.6"/><text x="312" y="672" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s08</text><text x="348" y="673" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">数据层</text><text x="288" y="710" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">PostgreSQL 记事实，Redis 唤醒</text><path d="M573.5,684 L591.5,684" fill="none" stroke="#7A54A8" stroke-width="2.2" marker-end="url(#arrow-7A54A8)"/><rect x="597.5" y="636" width="299.5" height="96" rx="14" fill="#FFFFFF" stroke="#7A54A8" stroke-width="1.6"/><rect x="615.5" y="654" width="48" height="26" rx="8" fill="#7A54A8" stroke="none" stroke-width="1.6"/><text x="639.5" y="672" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s09</text><text x="675.5" y="673" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">知识层</text><text x="615.5" y="710" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">可信门禁，Wiki / RAG</text><path d="M901,684 L919,684" fill="none" stroke="#7A54A8" stroke-width="2.2" marker-end="url(#arrow-7A54A8)"/><rect x="925" y="636" width="299.5" height="96" rx="14" fill="#FFFFFF" stroke="#7A54A8" stroke-width="1.6"/><rect x="943" y="654" width="48" height="26" rx="8" fill="#7A54A8" stroke="none" stroke-width="1.6"/><text x="967" y="672" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s10</text><text x="1003" y="673" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">Skill 与 Workflow</text><text x="943" y="710" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">可以提议，不能自批</text><path d="M1228.5,684 L1246.5,684" fill="none" stroke="#7A54A8" stroke-width="2.2" marker-end="url(#arrow-7A54A8)"/><rect x="1252.5" y="636" width="299.5" height="96" rx="14" fill="#FFFFFF" stroke="#7A54A8" stroke-width="1.6"/><rect x="1270.5" y="654" width="48" height="26" rx="8" fill="#7A54A8" stroke="none" stroke-width="1.6"/><text x="1294.5" y="672" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s11</text><text x="1330.5" y="673" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">模型网关</text><text x="1270.5" y="710" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">统一协议、多模型、管住花费</text><path d="M1402.25,736 L1402.25,762 L474.33333333333337,762 L474.33333333333337,786" fill="none" stroke="#B8C0C6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow-B8C0C6)"/><rect x="48" y="894" width="196" height="132" rx="16" fill="#F4F5F6" stroke="#B8C0C6" stroke-width="1.6"/><rect x="48" y="912" width="5" height="96" rx="2.5" fill="#B8C0C6"/><text x="72" y="936" font-size="14" fill="#6B7780" font-weight="600" text-anchor="start">阶段 5</text><text x="72" y="968" font-size="24" fill="#6B7780" font-weight="700" text-anchor="start">走向生产</text><text x="72" y="996" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">从部署到多主机</text><rect x="270" y="792" width="408.6666666666667" height="138" rx="14" fill="#FFFFFF" stroke="#4A7BB7" stroke-width="1.6"/><rect x="288" y="810" width="48" height="26" rx="8" fill="#4A7BB7" stroke="none" stroke-width="1.6"/><text x="312" y="828" font-size="15" fill="#FFFFFF" font-weight="700" text-anchor="middle">s12</text><rect x="588.6666666666667" y="810" width="72" height="26" rx="8" fill="#EAF2FB" stroke="none" stroke-width="1.6"/><text x="624.6666666666667" y="828" font-size="14" fill="#24507F" font-weight="600" text-anchor="middle">已完成</text><text x="288" y="860" font-size="19" fill="#1F2933" font-weight="700" text-anchor="start">上云部署</text><text x="288" y="888" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">一台没人看着的服务器，也能自己起来、自己恢复</text><path d="M682.6666666666667,861 L700.6666666666667,861" fill="none" stroke="#B8C0C6" stroke-width="2.2" marker-end="url(#arrow-B8C0C6)"/><rect x="706.6666666666667" y="792" width="408.6666666666667" height="138" rx="14" fill="#FBFBF9" stroke="#B8C0C6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="724.6666666666667" y="810" width="48" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="748.6666666666667" y="828" font-size="15" fill="#6B7780" font-weight="700" text-anchor="middle">s13</text><rect x="1025.3333333333335" y="810" width="72" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="1061.3333333333335" y="828" font-size="14" fill="#6B7780" font-weight="600" text-anchor="middle">规划中</text><text x="724.6666666666667" y="860" font-size="19" fill="#6B7780" font-weight="700" text-anchor="start">账号与认证</text><text x="724.6666666666667" y="888" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">每个用户登录自己的账号，会话和任务都有归属</text><path d="M1119.3333333333335,861 L1137.3333333333335,861" fill="none" stroke="#B8C0C6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow-B8C0C6)"/><rect x="1143.3333333333335" y="792" width="408.6666666666667" height="138" rx="14" fill="#FBFBF9" stroke="#B8C0C6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="1161.3333333333335" y="810" width="48" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="1185.3333333333335" y="828" font-size="15" fill="#6B7780" font-weight="700" text-anchor="middle">s14</text><rect x="1462.0000000000002" y="810" width="72" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="1498.0000000000002" y="828" font-size="14" fill="#6B7780" font-weight="600" text-anchor="middle">规划中</text><text x="1161.3333333333335" y="860" font-size="19" fill="#6B7780" font-weight="700" text-anchor="start">用户隔离</text><text x="1161.3333333333335" y="888" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">每个用户一个独立的运行环境，互不可见</text><path d="M1347.6666666666667,934 L1347.6666666666667,960 L583.5,960 L583.5,984" fill="none" stroke="#B8C0C6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow-B8C0C6)"/><rect x="270" y="990" width="627" height="138" rx="14" fill="#FBFBF9" stroke="#B8C0C6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="288" y="1008" width="48" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="312" y="1026" font-size="15" fill="#6B7780" font-weight="700" text-anchor="middle">s15</text><rect x="807" y="1008" width="72" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="843" y="1026" font-size="14" fill="#6B7780" font-weight="600" text-anchor="middle">规划中</text><text x="288" y="1058" font-size="19" fill="#6B7780" font-weight="700" text-anchor="start">权限与资源 Hub</text><text x="288" y="1086" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">角色、权益与资源范围：知识库、工具、Skill、Agent 谁能用、谁能改</text><path d="M901,1059 L919,1059" fill="none" stroke="#B8C0C6" stroke-width="2.2" stroke-dasharray="5 4" marker-end="url(#arrow-B8C0C6)"/><rect x="925" y="990" width="627" height="138" rx="14" fill="#FBFBF9" stroke="#B8C0C6" stroke-width="1.6" stroke-dasharray="6 5"/><rect x="943" y="1008" width="48" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="967" y="1026" font-size="15" fill="#6B7780" font-weight="700" text-anchor="middle">s16</text><rect x="1462" y="1008" width="72" height="26" rx="8" fill="#E3E7EA" stroke="none" stroke-width="1.6"/><text x="1498" y="1026" font-size="14" fill="#6B7780" font-weight="600" text-anchor="middle">规划中</text><text x="943" y="1058" font-size="19" fill="#6B7780" font-weight="700" text-anchor="start">多主机调度</text><text x="943" y="1086" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">任务分到多台机器，坏了一台有人接手</text><text x="48" y="1190" font-size="16" fill="#6B7780" font-weight="400" text-anchor="start">学完 s11，就是仓库里的 app/：在它之上做成 Docker 部署、Web 工作台和互动课程。</text></g></svg>
