# 只运行离线检查：不调用真实模型，不依赖 PostgreSQL / Redis。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - stages/s00-sdk-quickstart
          - stages/s01-single-turn
          - stages/s02-multi-turn
          - stages/s03-agent-core
          - stages/s04-data-layer
          - stages/s05-knowledge-layer
          - stages/s06-skill-workflow
          - app
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test
      - name: Web 工作台与课程一致性
        if: matrix.package == 'app'
        run: |
          npm run test:web
          npm run course:check

  docs:
    name: 文档、结构与隐私
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node stages/verify.mjs --docs-only
      - name: 隐私检查（本机路径、个人邮箱、公网 IP、密钥）
        run: |
          node --test scripts/privacy-check.test.mjs
          node scripts/privacy-check.mjs
