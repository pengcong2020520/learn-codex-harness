# 只运行离线检查：不调用真实模型，不依赖 PostgreSQL / Redis。模型网关测试用 Docker 拉起锁定版本的 Bifrost，模型服务是本机模拟的。
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: test (${{ matrix.package }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package:
          - stages/s00-sdk-quickstart
          - stages/s01-single-turn
          - stages/s02-multi-turn
          - stages/s03-service
          - stages/s04-events-messages
          - stages/s05-agent-assembly
          - stages/s06-tools
          - stages/s07-memory
          - stages/s08-data-layer
          - stages/s09-knowledge-layer
          - stages/s10-skill-workflow
          - stages/s11-model-gateway
          - stages/s12-deploy
          - stages/s13-auth
          - stages/s14-isolation
          - stages/s15-hub
          - stages/s16-coordination
          - stages/s17-sharding
          - stages/s18-replication
          - app
          - course
    defaults:
      run:
        working-directory: ${{ matrix.package }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: ${{ matrix.package }}/package-lock.json
      - run: npm ci
      - run: npm test
      # s13 起的包另有一组要监听本机端口的测试（真实 HTTP、CLI 子进程）；没有这个脚本的包跳过。
      - name: 本机端口测试
        run: npm run test:ports --if-present
      - name: Web 工作台与课程一致性
        if: matrix.package == 'course'
        run: |
          npm run test:web
          npm run course:check
      - name: 脚手架网页（Chrome + 假 Codex）
        if: matrix.package == 'app'
        run: npm run test:web
      - name: 模型网关（真 Bifrost 容器 + 模拟模型服务 + 真 Codex）
        if: matrix.package == 'app'
        run: npm run test:gateway

  docs:
    name: 文档、结构与隐私
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
      - run: node stages/verify.mjs --docs-only
      - name: 隐私检查（本机路径、个人邮箱、公网 IP、密钥）
        run: |
          node --test scripts/privacy-check.test.mjs
          node scripts/privacy-check.mjs

  scaffold-e2e:
    strategy:
      fail-fast: false
      matrix:
        user: [root, normal]
    env:
      FORCE_COLOR: "1"
      COMPOSE_PROJECT_NAME: codex-agent-e2e-${{ matrix.user }}
    name: 脚手架端到端（${{ matrix.user }}，单节点与扩容）
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: app/package-lock.json
      - run: npm ci
      - name: 服务器 root 路径：上手、API、网页与三节点副本
        if: matrix.user == 'root'
        run: sudo env "PATH=$PATH" "FORCE_COLOR=$FORCE_COLOR" "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT_NAME" bash scripts/e2e-compose.sh
      - name: 普通用户路径：上手、API、网页与三节点副本
        if: matrix.user == 'normal'
        run: bash scripts/e2e-compose.sh
