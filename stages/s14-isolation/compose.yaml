name: codex-harness-s14
x-runtime: &runtime
  restart: unless-stopped
  stop_grace_period: 30s
  logging:
    driver: json-file
    options:
      max-size: "10m"
      max-file: "3"
services:
  postgres:
    <<: *runtime
    image: postgres:16
    mem_limit: ${POSTGRES_MEMORY_LIMIT:-256m}
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD}
      POSTGRES_DB: agent_s14
    # 教学只发布 agent；数据库、Redis、网关不需要任何宿主端口。
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_s14"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    <<: *runtime
    image: redis:7.4
    mem_limit: ${REDIS_MEMORY_LIMIT:-128m}
    command: ["redis-server", "--appendonly", "yes"]
    volumes: ["redis-data:/data"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
  gateway:
    <<: *runtime
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    mem_limit: ${GATEWAY_MEMORY_LIMIT:-256m}
    # 网关访问密钥用于校验调用者；服务商密钥只进入这个服务。
    environment:
      AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:?Set AGENT_GATEWAY_KEY}
      ARK_API_KEY: ${ARK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    tmpfs: ["/app/data:uid=1000,gid=0,mode=0770"]
    volumes: ["./.data/gateway/config.json:/app/data/config.json:ro", "./.data/gateway/model-parameters.json:/app/data/model-parameters.json:ro"]
    depends_on:
      postgres: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
  agent:
    <<: *runtime
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
        APT_MIRROR: ${APT_MIRROR:-}
        CONTAINER_APP_DIR: ${CONTAINER_APP_DIR:?Set to the absolute deployment directory}
    image: codex-harness-s14:current
    user: "0:1000"
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, FOWNER]
    security_opt: [no-new-privileges:true]
    init: true
    mem_limit: ${AGENT_MEMORY_LIMIT:-768m}
    environment:
      AGENT_DEPLOYED: "true"
      AGENT_LISTEN_HOST: 0.0.0.0
      AGENT_PORT: "4328"
      AGENT_GATEWAY_URL: http://gateway:8080/v1
      AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:?Set AGENT_GATEWAY_KEY}
      DATABASE_URL: postgresql://agent:${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD}@postgres:5432/agent_s14
      REDIS_URL: redis://redis:6379/0
      CODEX_MODEL_CATALOG_ENABLED: "true"
      CODEX_MODEL: ${CODEX_MODEL:-kimi/kimi-k2.7-code}
      AGENT_DEFINITION: ${AGENT_DEFINITION:-agents/writing/agent.json}
      AGENT_WEB_SEARCH: ${AGENT_WEB_SEARCH:-auto}
      AGENT_MAX_CONCURRENT_TURNS: ${AGENT_MAX_CONCURRENT_TURNS:-2}
      AGENT_MAX_QUEUED: ${AGENT_MAX_QUEUED:-200}
      AGENT_RATE_LIMIT_PER_MINUTE: ${AGENT_RATE_LIMIT_PER_MINUTE:-120}
      AGENT_MAX_SSE: ${AGENT_MAX_SSE:-20}
      AGENT_MEMORY_ENABLED: ${AGENT_MEMORY_ENABLED:-false}
      AGENT_MEMORY_USE: ${AGENT_MEMORY_USE:-true}
      AGENT_MEMORY_GENERATE: ${AGENT_MEMORY_GENERATE:-true}
      AGENT_MEMORY_EXTRACT_MODEL: ${AGENT_MEMORY_EXTRACT_MODEL:-}
      AGENT_MEMORY_CONSOLIDATION_MODEL: ${AGENT_MEMORY_CONSOLIDATION_MODEL:-}
      AGENT_MEMORY_MIN_IDLE_HOURS: ${AGENT_MEMORY_MIN_IDLE_HOURS:-6}
      AGENT_BUDGET_DAILY_TOKENS: ${AGENT_BUDGET_DAILY_TOKENS:-}
      AGENT_BUDGET_MONTHLY_TOKENS: ${AGENT_BUDGET_MONTHLY_TOKENS:-}
      AGENT_BUDGET_DAILY_COST: ${AGENT_BUDGET_DAILY_COST:-}
      AGENT_BUDGET_MONTHLY_COST: ${AGENT_BUDGET_MONTHLY_COST:-}
      AGENT_BUDGET_TIMEZONE: ${AGENT_BUDGET_TIMEZONE:-}
      AGENT_BUDGET_DOWNGRADE_AT: ${AGENT_BUDGET_DOWNGRADE_AT:-}
      AGENT_BUDGET_DOWNGRADE_SCENE: ${AGENT_BUDGET_DOWNGRADE_SCENE:-fast}
    ports: ["127.0.0.1:${AGENT_PORT:-4328}:4328"]
    # CONTAINER_APP_DIR 与宿主部署目录相同且保持不变。
    # Codex 历史记录的是绝对路径；换成 release/时间戳路径会导致旧会话无法恢复。
    volumes:
      - "./.data:${CONTAINER_APP_DIR}/.data"
      - "./.runs:${CONTAINER_APP_DIR}/.runs"
      - "./workspace:${CONTAINER_APP_DIR}/workspace"
      - "./backups:${CONTAINER_APP_DIR}/backups"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      gateway: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "deploy/ready.mjs"]
      interval: 5s
      timeout: 10s
      retries: 20
volumes:
  postgres-data:
  redis-data:
