<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="1000" viewBox="0 0 1120 1000" role="img" aria-labelledby="title desc">
<title id="title">单机多用户 Agent 目标架构</title><desc id="desc">三个客户端进入统一认证与业务服务，PostgreSQL 记录归属和调度。运行环境管理器为每个活跃用户管理独立 Codex 进程、MCP 授权入口及本机持久目录。</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#738398"/></marker></defs>
<style>text{font-family:system-ui,-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;fill:#182b40;font-size:17px}.title{font-size:24px;font-weight:700}.h{font-size:19px;font-weight:650}.s{font-size:15px;fill:#526579}.edge{fill:none;stroke:#738398;stroke-width:1.8;marker-end:url(#arrow)}</style>
<rect width="1120" height="1000" fill="#f7f9fc" rx="16"/>
<text x="40" y="44" class="title">单机多用户 Agent · 目标架构</text><text x="40" y="72" class="s">共享产品代码与业务服务；用户身份、运行状态和持久数据分别隔离</text>
<rect x="80" y="99" width="300" height="70" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="230.0" y="127.0" class="h">Web</text><text text-anchor="middle" x="230.0" y="153.0" class="s">Cookie + 内存 Access Token</text><rect x="410" y="99" width="300" height="70" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="560.0" y="127.0" class="h">App</text><text text-anchor="middle" x="560.0" y="153.0" class="s">系统安全存储 + Access Token</text><rect x="740" y="99" width="300" height="70" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="890.0" y="127.0" class="h">CLI</text><text text-anchor="middle" x="890.0" y="153.0" class="s">凭据库 + Access Token</text><path d="M230 169 V192 H560 V219" class="edge"/><path d="M560 169 V219" class="edge"/><path d="M890 169 V192 H560" class="edge"/><rect x="30" y="204" width="1060" height="684" rx="16" fill="none" stroke="#aabed3" stroke-dasharray="6 5"/><text x="48" y="235" class="s">同一台服务器</text><rect x="270" y="221" width="580" height="72" rx="10" fill="#eaf2ff" stroke="#aac7f0"/><text text-anchor="middle" x="560.0" y="250.0" class="h">统一 API · 认证与授权</text><text text-anchor="middle" x="560.0" y="276.0" class="s">服务端确定 userId · 检查归属 · 三端共用接口</text><path d="M560 293 V325" class="edge"/><rect x="60" y="325" width="660" height="88" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="390.0" y="349.0" class="h">会话与任务服务</text><text text-anchor="middle" x="390.0" y="375.0" class="s">会话映射 · 消息调度 · 工具策略 · 并发与用量</text><text text-anchor="middle" x="390.0" y="401.0" class="s">保留 FIFO / append / 幂等 / 异常暂停</text><rect x="760" y="325" width="300" height="88" rx="10" fill="#eef4ff" stroke="#cbd7e4"/><text text-anchor="middle" x="910.0" y="349.0" class="h">PostgreSQL</text><text text-anchor="middle" x="910.0" y="375.0" class="s">账号与登录态 · 资源归属</text><text text-anchor="middle" x="910.0" y="401.0" class="s">任务状态 · 配额与审计</text><path d="M720 369 H760" class="edge"/><path d="M390 413 V448" class="edge"/><rect x="60" y="448" width="660" height="72" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="390.0" y="477.0" class="h">RuntimeManager · 运行环境管理</text><text text-anchor="middle" x="390.0" y="503.0" class="s">按用户懒启动 / 复用 / 空闲回收 · 全局容量与公平排队</text><rect x="760" y="448" width="300" height="72" rx="10" fill="#f1f2f5" stroke="#cbd7e4"/><text text-anchor="middle" x="910.0" y="477.0" class="h">可信公共代码</text><text text-anchor="middle" x="910.0" y="503.0" class="s">Role / Tool Schema / 工具实现</text><path d="M760 484 H720" class="edge"/><path d="M390 520 V542 H292 V568" class="edge"/><path d="M390 542 H828 V568" class="edge"/><rect x="60" y="568" width="465" height="278" rx="14" fill="#edf8f3" stroke="#b8cbd8"/><text x="292.5" y="601" class="h" text-anchor="middle">用户 A · 独立运行环境</text><rect x="78" y="618" width="205" height="68" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="180.5" y="645.0" class="h">Codex 进程</text><text text-anchor="middle" x="180.5" y="671.0" class="s">原生 Thread / Turn</text><rect x="302" y="618" width="205" height="68" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="404.5" y="645.0" class="h">MCP 工具入口</text><text text-anchor="middle" x="404.5" y="671.0" class="s">用户 + 执行授权绑定</text><path d="M283 652 H302" class="edge"/><path d="M180 686 V714" class="edge"/><path d="M404 686 V714" class="edge"/><rect x="78" y="714" width="429" height="108" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="292.5" y="748.0" class="h">本机用户持久目录</text><text text-anchor="middle" x="292.5" y="774.0" class="s">codex/：原生 SQLite / JSONL / 记忆</text><text text-anchor="middle" x="292.5" y="800.0" class="s">workspace/：用户文件 · runs/：运行日志</text><rect x="595" y="568" width="465" height="278" rx="14" fill="#f0f4ff" stroke="#b8cbd8"/><text x="827.5" y="601" class="h" text-anchor="middle">用户 B · 独立运行环境</text><rect x="613" y="618" width="205" height="68" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="715.5" y="645.0" class="h">Codex 进程</text><text text-anchor="middle" x="715.5" y="671.0" class="s">原生 Thread / Turn</text><rect x="837" y="618" width="205" height="68" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="939.5" y="645.0" class="h">MCP 工具入口</text><text text-anchor="middle" x="939.5" y="671.0" class="s">用户 + 执行授权绑定</text><path d="M818 652 H837" class="edge"/><path d="M715 686 V714" class="edge"/><path d="M939 686 V714" class="edge"/><rect x="613" y="714" width="429" height="108" rx="10" fill="#fff" stroke="#cbd7e4"/><text text-anchor="middle" x="827.5" y="748.0" class="h">本机用户持久目录</text><text text-anchor="middle" x="827.5" y="774.0" class="s">codex/：原生 SQLite / JSONL / 记忆</text><text text-anchor="middle" x="827.5" y="800.0" class="s">workspace/：用户文件 · runs/：运行日志</text><text x="560" y="872" text-anchor="middle" class="s">建议首版每用户 1 个活动 Turn；用户间并行。MCP 执行绑定需先通过原生集成验证。</text><path d="M30 652 H15 V934 H340" class="edge"/><path d="M60 652 H30" fill="none" stroke="#738398" stroke-width="1.8"/><path d="M1060 652 H1105 V934 H780" class="edge"/><rect x="340" y="902" width="440" height="64" rx="10" fill="#fff7e9" stroke="#e1c791"/><text text-anchor="middle" x="560.0" y="927.0" class="h">模型 API / 受控外部服务</text><text text-anchor="middle" x="560.0" y="953.0" class="s">在服务器外；凭据由服务端配置</text></svg>