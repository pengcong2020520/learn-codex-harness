<rect x="40" y="505" width="820" height="150" rx="14" fill="#fff9f9" stroke="#d9a0a6" stroke-width="1.5"/>
<text x="60" y="541" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#b63743">03  通用门禁</text>
<text x="60" y="577" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">可信 Task 上下文 ∩ 工具白名单 ∩ 资源归属 / KB 授权</text>
<text x="60" y="607" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">原生工具回调与 HTTP 操作共用判定；同一 Node 进程</text>
<path d="M920,580 L860,580" fill="none" stroke="#305780" stroke-width="2" marker-end="url(#arrow)"/>
