<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="1470" viewBox="0 0 1280 1470" role="img" aria-labelledby="title desc"><title id="title">s05 总体架构</title><desc id="desc">按职责分层；右侧为独立 Codex 原生进程；红色表示相较上一 Demo 的新增或变化。</desc><defs><marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto-start-reverse"><path d="M0,0 L8,4 L0,8" fill="#305780"/></marker></defs><rect width="1280" height="1470" fill="#f7f9fc"/>
<text x="40" y="55" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="32" font-weight="650" fill="#192d44">S05  /  知识层与通用门禁</text>
<text x="40" y="91" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">纵向箭头表示能力依赖；右侧箭头表示与 Codex 的实际通信</text>
<text x="40" y="122" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="18" font-weight="400" fill="#b63743">红色：本阶段新增或变化    ·    蓝色：复用能力    ·    分层表示职责，不代表独立服务</text>
<rect x="40" y="150" width="820" height="100" rx="14" fill="#fff" stroke="#d5e0e9" stroke-width="1.5"/>
<text x="60" y="186" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#192d44">01  交互入口</text>
<text x="60" y="221" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#586d81">本地 CLI / knowledge CLI  →  HTTP / SSE  ·  本地 Bearer 凭据</text>
<path d="M450,250 L450,279" fill="none" stroke="#305780" stroke-width="2" marker-end="url(#arrow)"/>
<rect x="40" y="280" width="820" height="170" rx="14" fill="#fff" stroke="#d5e0e9" stroke-width="1.5"/>
<text x="60" y="316" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#192d44">02  Agent 装配与任务调度</text>
<text x="60" y="352" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">Agent 配置 → 角色、原生 Skills、工具白名单、KB 挂载</text>
<text x="60" y="382" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">会话绑定 · FIFO / steer · 原生 Thread / Turn 控制（stdio）</text>
<text x="60" y="419" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#b63743">服务端签发 Task 上下文，再绑定原生 Thread / Turn</text>
<path d="M860,355 L920,355" fill="none" stroke="#305780" stroke-width="2" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
<rect x="920" y="150" width="320" height="100" rx="14" fill="#fff" stroke="#d5e0e9" stroke-width="1.5"/>
<text x="944" y="190" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="23" font-weight="600" fill="#192d44">模型 API</text>
<text x="944" y="224" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">推理请求与响应</text>
<rect x="920" y="280" width="320" height="355" rx="14" fill="#edf4fa" stroke="#d5e0e9" stroke-width="1.5"/>
