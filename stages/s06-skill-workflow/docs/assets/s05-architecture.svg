<text x="944" y="394" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">本机独立子进程</text>
<text x="944" y="424" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">原生模型 / 工具循环</text>
<text x="944" y="454" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">原生 Skills</text>
<text x="944" y="484" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="400" fill="#586d81">Thread / Turn / 上下文</text>
<text x="944" y="550" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="20" font-weight="600" fill="#305780">工具调用返回产品侧</text>
<text x="944" y="585" font-family="PingFang SC, Microsoft YaHei, sans-serif" font-size="21" font-weight="400" fill="#b63743">dynamicTools 回调</text>
