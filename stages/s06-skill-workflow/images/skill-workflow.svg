<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="title desc"><title id="title">S06 细节：一个任务怎么走完 Workflow</title><desc id="desc">Skill 教方法，Workflow 管边界和终点；模型决定怎么做，权限和验收留在模型之外。</desc><defs><marker id="m1F2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F2933" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="830" fill="#FBFBF9"/><text x="48" y="72" font-size="30" fill="#1F2933" font-weight="700">S06 细节：一个任务怎么走完 Workflow</text><text x="48" y="112" font-size="19" fill="#6B7780">Skill 教方法，Workflow 管边界和终点；模型决定怎么做，权限和验收留在模型之外。</text><rect x="48" y="150" width="1504" height="176" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="186" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">配置：由部署者定义，跟着 Agent 包走</text><rect x="72" y="206" width="456" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="73" y="222" width="4" height="64" rx="2" fill="#D9622B"/><text x="90" y="240" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">Agent 包</text><text x="90" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">agent.json · role.md</text><text x="90" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">skills/ · workflows/</text><path d="M534,254 L564,254" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><text x="552" y="244" font-size="13" fill="#6B7780" font-weight="500" text-anchor="middle">同步</text><rect x="572" y="206" width="456" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="573" y="222" width="4" height="64" rx="2" fill="#D9622B"/><text x="590" y="240" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">CODEX_HOME/skills</text><text x="590" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">启动时同步</text><text x="590" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">只启用声明的 Skill</text><rect x="1072" y="206" width="456" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="1090" y="240" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">Workspace</text><text x="1090" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">用户资料与产物</text><text x="1090" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">不放角色与 Skill</text><rect x="48" y="350" width="1504" height="176" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="386" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">执行：一步一步走，权限只在本任务有效</text><rect x="72" y="406" width="256" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="90" y="440" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">提交任务</text><text x="90" y="466" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">/messages + workflow</text><text x="90" y="488" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">或用户确认过的提议</text><path d="M334,454 L364,454" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="372" y="406" width="256" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="373" y="422" width="4" height="64" rx="2" fill="#D9622B"/><text x="390" y="440" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">Workflow 解析</text><text x="390" y="466" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">校验参数与授权</text><text x="390" y="488" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">定本步目标和写入范围</text><path d="M634,454 L664,454" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="672" y="406" width="256" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="673" y="422" width="4" height="64" rx="2" fill="#D9622B"/><text x="690" y="440" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">权限门</text><text x="690" y="466" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">grants 只在本任务有效</text><text x="690" y="488" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">轮次结束即撤销</text><path d="M934,454 L964,454" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="972" y="406" width="256" height="96" rx="12" fill="#EEF7F2" stroke="#B5DCCB" stroke-width="1.5"/><text x="990" y="440" font-size="17" fill="#2F7D62" font-weight="650" text-anchor="start">Codex 执行</text><text x="990" y="466" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">怎么做由模型决定</text><text x="990" y="488" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">skill_read 读取方法</text><path d="M1234,454 L1264,454" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="1272" y="406" width="256" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="1273" y="422" width="4" height="64" rx="2" fill="#D9622B"/><text x="1290" y="440" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">验收</text><text x="1290" y="466" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">只看结果</text><text x="1290" y="488" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">不看调了哪些工具</text><rect x="48" y="550" width="1504" height="204" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="586" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">一步结束后的去向</text><rect x="72" y="606" width="331" height="96" rx="12" fill="#FFF8E6" stroke="#E3B341" stroke-width="1.5"/><text x="90" y="640" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">验收不通过</text><text x="90" y="666" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">needs-review</text><text x="90" y="688" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">不暂停队列、不重试</text><rect x="447" y="606" width="331" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="448" y="622" width="4" height="64" rx="2" fill="#D9622B"/><text x="465" y="640" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">需要确认</text><text x="465" y="666" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">waiting</text><text x="465" y="688" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">/confirm 后继续</text><rect x="822" y="606" width="331" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="840" y="640" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">无需确认</text><text x="840" y="666" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">直接排队下一步</text><rect x="1197" y="606" width="331" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="1215" y="640" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">最后一步</text><text x="1215" y="666" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">completed</text><text x="72" y="736" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">propose_task：需要别的 Workflow 时，模型只能提议；用户确认前不执行、不授权。</text><rect x="48" y="786" width="22" height="16" rx="4" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><text x="78" y="800" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">本阶段新增</text><rect x="218" y="786" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="248" y="800" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">沿用</text><rect x="388" y="786" width="22" height="16" rx="4" fill="#EEF7F2" stroke="#B5DCCB" stroke-width="1.5"/><text x="418" y="800" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">Codex 原生</text><rect x="558" y="786" width="22" height="16" rx="4" fill="#FFF8E6" stroke="#E3B341" stroke-width="1.5"/><text x="588" y="800" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">需要注意的分支</text></g></svg>
