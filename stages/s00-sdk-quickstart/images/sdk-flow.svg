<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b63743"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="720" height="420" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">s00 · SDK 调用链 — 你的程序把任务交给本机 Codex</text>
  <rect x="24" y="76" width="132" height="72" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="90" y="98" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">你的程序</text>
  <text x="90" y="117" fill="#475569" font-size="11.5" text-anchor="middle">examples/*.mjs</text>
  <rect x="204" y="76" width="132" height="72" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="98" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">Codex SDK</text>
  <text x="270" y="117" fill="#475569" font-size="11.5" text-anchor="middle">@openai/codex-sdk</text>
  <rect x="384" y="76" width="132" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="98" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">本机 Codex</text>
  <text x="450" y="117" fill="#475569" font-size="11.5" text-anchor="middle">CLI 子进程（harness）</text>
  <rect x="564" y="76" width="132" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="630" y="98" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">模型 API</text>
  <text x="630" y="117" fill="#475569" font-size="11.5" text-anchor="middle">Responses 接口</text>
  <path d="M 156 112 L 204 112" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="180" y="104" fill="#2563eb" font-size="11" text-anchor="middle">run()</text>
  <path d="M 336 112 L 384 112" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="360" y="104" fill="#2563eb" font-size="11" text-anchor="middle">stdio</text>
  <path d="M 516 104 L 564 104" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="540" y="96" fill="#2563eb" font-size="11" text-anchor="middle">推理</text>
  <path d="M 564 124 L 516 124" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="384" y="190" width="132" height="72" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="450" y="212" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">本机工具</text>
  <text x="450" y="231" fill="#475569" font-size="11.5" text-anchor="middle">读写文件 · 运行命令</text>
  <text x="450" y="247" fill="#475569" font-size="11.5" text-anchor="middle">受 sandboxMode 约束</text>
  <path d="M 430 148 L 430 190" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="424" y="174" fill="#555" font-size="11" text-anchor="end">调用</text>
  <path d="M 470 190 L 470 148" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="476" y="174" fill="#555" font-size="11" text-anchor="start">结果</text>
  <rect x="24" y="290" width="492" height="50" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="270" y="312" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">事件流 runStreamed()</text>
  <text x="270" y="331" fill="#475569" font-size="11.5" text-anchor="middle">thread.started → item.started / item.completed → turn.completed</text>
  <path d="M 270 148 L 270 290" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="276" y="222" fill="#2563eb" font-size="11" text-anchor="start">事件</text>
  <path d="M 90 290 L 90 148" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <text x="96" y="222" fill="#2563eb" font-size="11" text-anchor="start">逐条处理</text>
  <rect x="564" y="190" width="132" height="128" rx="8" fill="#fffbea" stroke="#d4a72c" stroke-width="2"/>
  <text x="630" y="212" fill="#7a5b00" font-size="13" font-weight="700" text-anchor="middle">三个概念</text>
  <text x="630" y="231" fill="#475569" font-size="11.5" text-anchor="middle">Thread：一段对话</text>
  <text x="630" y="247" fill="#475569" font-size="11.5" text-anchor="middle">可凭 ID 恢复</text>
  <text x="630" y="263" fill="#475569" font-size="11.5" text-anchor="middle">Turn：一次任务</text>
  <text x="630" y="279" fill="#475569" font-size="11.5" text-anchor="middle">Item：过程中的一步</text>
  <text x="630" y="295" fill="#475569" font-size="11.5" text-anchor="middle">消息 · 命令 · 文件变更</text>
  <rect x="24" y="356" width="672" height="44" rx="8" fill="#fdf0ef" stroke="#b63743" stroke-width="2"/>
  <text x="360" y="382" fill="#475569" font-size="11.5" text-anchor="middle">你的程序独立验收：修复前测试必须失败 → 修复后必须通过 → 测试文件不得被改动</text>
</svg>
