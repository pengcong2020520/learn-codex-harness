<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="886" viewBox="0 0 1600 886" role="img" aria-labelledby="title desc"><title id="title">S11 细节：模型网关的三层作用</title><desc id="desc">各家服务商的密钥只交给网关；Codex 只拿网关访问密钥。</desc><defs><marker id="m1F2933" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#1F2933" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><g font-family="PingFang SC, Microsoft YaHei, Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="886" fill="#FBFBF9"/><text x="48" y="72" font-size="30" fill="#1F2933" font-weight="700">S11 细节：模型网关的三层作用</text><text x="48" y="112" font-size="19" fill="#6B7780">各家服务商的密钥只交给网关；Codex 只拿网关访问密钥。</text><rect x="48" y="150" width="1504" height="204" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="186" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">① 统一协议</text><rect x="72" y="206" width="456" height="96" rx="12" fill="#EEF7F2" stroke="#B5DCCB" stroke-width="1.5"/><text x="90" y="240" font-size="17" fill="#2F7D62" font-weight="650" text-anchor="start">Codex</text><text x="90" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">只说 Responses</text><text x="90" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">用网关访问密钥</text><path d="M534,254 L564,254" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="572" y="206" width="456" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="573" y="222" width="4" height="64" rx="2" fill="#D9622B"/><text x="590" y="240" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">模型网关 · Bifrost</text><text x="590" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">Responses 原样转发</text><text x="590" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">其余转 Chat / Messages</text><path d="M1034,254 L1064,254" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="1072" y="206" width="456" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="1090" y="240" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">各家模型</text><text x="1090" y="266" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">Kimi / DeepSeek / 智谱…</text><text x="1090" y="288" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">密钥只在网关</text><text x="72" y="336" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">模型自带联网搜索：清单写 nativeTools，AGENT_WEB_SEARCH=auto / off；开搜索时只路由到有 web_search 能力的模型。</text><rect x="48" y="378" width="1504" height="204" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="414" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">② 多模型协调</text><rect x="72" y="434" width="456" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="73" y="450" width="4" height="64" rx="2" fill="#D9622B"/><text x="90" y="468" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">模型清单</text><text x="90" y="494" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">config/models.json</text><text x="90" y="516" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">用途 · 候选 · 场景 · 能力</text><path d="M534,482 L564,482" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="572" y="434" width="456" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="573" y="450" width="4" height="64" rx="2" fill="#D9622B"/><text x="590" y="468" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">本次选谁</text><text x="590" y="494" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">步骤 &gt; 任务 &gt; 默认</text><text x="590" y="516" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">能力不符就换候选</text><path d="M1034,482 L1064,482" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="1072" y="434" width="456" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="1090" y="468" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">四种用途</text><text x="1090" y="494" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">对话 · 向量</text><text x="1090" y="516" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">生图 · 生视频</text><text x="72" y="564" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">每轮记下选中的模型和来源；主模型失败时，网关自动尝试已启用的备用模型。</text><rect x="48" y="606" width="1504" height="204" rx="16" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="72" y="642" font-size="18" fill="#1F2933" font-weight="700" text-anchor="start">③ 用量与预算</text><rect x="72" y="662" width="331" height="96" rx="12" fill="#FFF8E6" stroke="#E3B341" stroke-width="1.5"/><text x="90" y="696" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">派发前查预算</text><text x="90" y="722" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">超限：新任务保持排队</text><text x="90" y="744" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">在途轮次不打断</text><path d="M409,710 L439,710" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="447" y="662" width="331" height="96" rx="12" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="465" y="696" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">发起请求</text><text x="465" y="722" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">经网关到上游</text><path d="M784,710 L814,710" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="822" y="662" width="331" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="823" y="678" width="4" height="64" rx="2" fill="#D9622B"/><text x="840" y="696" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">用量入账</text><text x="840" y="722" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">按轮去重</text><text x="840" y="744" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">价格表估算金额</text><path d="M1159,710 L1189,710" fill="none" stroke="#1F2933" stroke-width="2" marker-end="url(#m1F2933)"/><rect x="1197" y="662" width="331" height="96" rx="12" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><rect x="1198" y="678" width="4" height="64" rx="2" fill="#D9622B"/><text x="1215" y="696" font-size="17" fill="#1F2933" font-weight="650" text-anchor="start">网关 token 限流</text><text x="1215" y="722" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">日上限兜底</text><text x="1215" y="744" font-size="14" fill="#6B7780" font-weight="400" text-anchor="start">超限直接拒绝</text><text x="72" y="792" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">运行中的请求仍会产生用量；预算和限流不保证费用精确封顶。</text><rect x="48" y="842" width="22" height="16" rx="4" fill="#FFF3EC" stroke="#D9622B" stroke-width="1.5"/><text x="78" y="856" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">本阶段新增</text><rect x="218" y="842" width="22" height="16" rx="4" fill="#FFFFFF" stroke="#E3E7EA" stroke-width="1.5"/><text x="248" y="856" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">沿用</text><rect x="388" y="842" width="22" height="16" rx="4" fill="#EEF7F2" stroke="#B5DCCB" stroke-width="1.5"/><text x="418" y="856" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">Codex 原生</text><rect x="558" y="842" width="22" height="16" rx="4" fill="#FFF8E6" stroke="#E3B341" stroke-width="1.5"/><text x="588" y="856" font-size="15" fill="#6B7780" font-weight="400" text-anchor="start">需要注意的分支</text></g></svg>
