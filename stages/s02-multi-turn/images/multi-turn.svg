<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 470" font-family="system-ui, -apple-system, 'PingFang SC', 'Microsoft YaHei', sans-serif">
  <defs>
    <marker id="arrow-gray" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#555"/></marker>
    <marker id="arrow-blue" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#2563eb"/></marker>
    <marker id="arrow-red" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#b63743"/></marker>
    <marker id="arrow-green" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#16a34a"/></marker>
    <linearGradient id="header" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#1e3a5f"/><stop offset="100%" stop-color="#2563eb"/></linearGradient>
  </defs>
  <rect width="720" height="470" fill="#fafbfc" rx="8"/>
  <rect x="0" y="0" width="720" height="48" fill="url(#header)" rx="8"/>
  <rect x="0" y="40" width="720" height="8" fill="url(#header)"/>
  <text x="360" y="31" fill="#fff" font-size="16" font-weight="700" text-anchor="middle">s02 · 多轮会话 — 输入排队，历史留在 Codex</text>
  <rect x="24" y="76" width="150" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="99" y="98" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">终端输入</text>
  <text x="99" y="117" fill="#475569" font-size="11.5" text-anchor="middle">用户可能提前</text>
  <text x="99" y="133" fill="#475569" font-size="11.5" text-anchor="middle">一次敲入多行</text>
  <rect x="208" y="76" width="150" height="76" rx="8" fill="#fdf0ef" stroke="#b63743" stroke-width="2"/>
  <text x="283" y="98" fill="#8f1d2c" font-size="13" font-weight="700" text-anchor="middle">FIFO 输入队列</text>
  <text x="283" y="117" fill="#475569" font-size="11.5" text-anchor="middle">line 事件先入队</text>
  <text x="283" y="133" fill="#475569" font-size="11.5" text-anchor="middle">上一轮结束才取下一条</text>
  <rect x="392" y="76" width="150" height="76" rx="8" fill="#fdf0ef" stroke="#b63743" stroke-width="2"/>
  <text x="467" y="98" fill="#8f1d2c" font-size="13" font-weight="700" text-anchor="middle">聊天循环</text>
  <text x="467" y="117" fill="#475569" font-size="11.5" text-anchor="middle">普通文本 → runTurn</text>
  <text x="467" y="133" fill="#475569" font-size="11.5" text-anchor="middle">/resume /help /exit</text>
  <rect x="576" y="76" width="120" height="76" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="636" y="98" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">Codex</text>
  <text x="636" y="117" fill="#475569" font-size="11.5" text-anchor="middle">App Server</text>
  <path d="M 174 114 L 208 114" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 358 114 L 392 114" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <path d="M 542 114 L 576 114" fill="none" stroke="#2563eb" stroke-width="1.8" marker-end="url(#arrow-blue)"/>
  <rect x="392" y="196" width="304" height="108" rx="8" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="544" y="218" fill="#1e3a5f" font-size="13" font-weight="700" text-anchor="middle">同一个 Thread（threadId 不变）</text>
  <rect x="408" y="236" width="80" height="32" rx="8" fill="#effaf3" stroke="#16a34a" stroke-width="2"/>
  <text x="448" y="256" fill="#475569" font-size="11.5" text-anchor="middle">Turn 1</text>
  <rect x="504" y="236" width="80" height="32" rx="8" fill="#effaf3" stroke="#16a34a" stroke-width="2"/>
  <text x="544" y="256" fill="#475569" font-size="11.5" text-anchor="middle">Turn 2</text>
  <rect x="600" y="236" width="80" height="32" rx="8" fill="#effaf3" stroke="#16a34a" stroke-width="2"/>
  <text x="640" y="256" fill="#475569" font-size="11.5" text-anchor="middle">Turn 3 …</text>
  <text x="544" y="290" fill="#475569" font-size="11" font-weight="400" text-anchor="middle">首条消息 thread/start，之后只发 turn/start</text>
  <path d="M 636 152 L 636 196" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <rect x="392" y="340" width="304" height="56" rx="8" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <text x="544" y="362" fill="#374151" font-size="13" font-weight="700" text-anchor="middle">Codex 原生历史</text>
  <text x="544" y="381" fill="#475569" font-size="11.5" text-anchor="middle">.data/codex（SQLite / JSONL）</text>
  <path d="M 544 304 L 544 340" fill="none" stroke="#555" stroke-width="1.8" marker-end="url(#arrow-gray)"/>
  <text x="552" y="326" fill="#555" font-size="11" text-anchor="start">原生持久化</text>
  <rect x="24" y="196" width="334" height="108" rx="8" fill="#fdf0ef" stroke="#b63743" stroke-width="2"/>
  <text x="36" y="218" fill="#8f1d2c" font-size="13" font-weight="700" text-anchor="start">/resume 恢复</text>
  <text x="36" y="237" fill="#475569" font-size="11.5" text-anchor="start">1. thread/list：只列本项目 .runs 目录下的会话</text>
  <text x="36" y="253" fill="#475569" font-size="11.5" text-anchor="start">2. 按名称 / 开场问题 / ID 过滤，每页 10 条</text>
  <text x="36" y="269" fill="#475569" font-size="11.5" text-anchor="start">3. thread/resume（excludeTurns: true）</text>
  <text x="36" y="285" fill="#475569" font-size="11.5" text-anchor="start">    之后的消息继续沿用原 Thread 的历史</text>
  <path d="M 358 250 L 392 250" fill="none" stroke="#b63743" stroke-width="1.8" marker-end="url(#arrow-red)"/>
  <rect x="24" y="340" width="334" height="56" rx="8" fill="#fffbea" stroke="#d4a72c" stroke-width="2"/>
  <text x="191" y="364" fill="#475569" font-size="11.5" text-anchor="middle">Node 端不保存、不拼接、不重发历史 messages</text>
  <text x="191" y="380" fill="#475569" font-size="11.5" text-anchor="middle">通知按 threadId + turnId 严格匹配，旧轮事件不串入</text>
  <rect x="24" y="422" width="14" height="14" rx="3" fill="#fdf0ef" stroke="#b63743" stroke-width="2"/>
  <text x="44" y="433" fill="#475569" font-size="11" font-weight="400" text-anchor="start">红色：本阶段新增或变化</text>
  <rect x="214" y="422" width="14" height="14" rx="3" fill="#f0f4ff" stroke="#2563eb" stroke-width="2"/>
  <text x="234" y="433" fill="#475569" font-size="11" font-weight="400" text-anchor="start">蓝色：沿用的结构</text>
</svg>
