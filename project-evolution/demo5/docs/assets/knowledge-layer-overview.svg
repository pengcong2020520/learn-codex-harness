<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1290" viewBox="0 0 1440 1290" role="img" aria-labelledby="title desc"><title id="title">通用权限门禁：统一授权，能力与资源各司其职</title><desc id="desc">v1.2 · 2026-10-04 · 替换原“扩展资源模块”中间层；门禁是共享代码模块，不是独立服务器。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#82929d"/></marker></defs><style>text{font-family:Arial,'PingFang SC','Microsoft YaHei',sans-serif;fill:#203542}.title{font-size:32px;font-weight:700}.sub{font-size:18px;fill:#5b6d77}.ct{font-size:23px;font-weight:650}.body{font-size:19px}.small{font-size:17px;fill:#5b6d77}.tag{font-size:14px;font-weight:700}.section{font-size:20px;font-weight:650}.line{fill:none;stroke:#82929d;stroke-width:2;marker-end:url(#arrow)}</style><rect width="1440" height="1290" fill="#ffffff"/><rect x="0" y="0" width="12" height="1290" fill="#991b1b"/>
<text x="48" y="56" class="title">01  通用权限门禁：统一授权，能力与资源各司其职</text>
<text x="48" y="91" class="sub">v1.2 · 2026-10-04 · 替换原“扩展资源模块”中间层；门禁是共享代码模块，不是独立服务器。</text>
<rect x="48" y="114" width="16" height="16" rx="3" fill="#fff5f4" stroke="#991b1b" stroke-width="2"/>
<text x="73" y="128" class="small">新增 / 新能力</text>
<rect x="260" y="114" width="16" height="16" rx="3" fill="#fff8f5" stroke="#db5b53" stroke-width="2"/>
<text x="285" y="128" class="small">改造 / 扩展现有</text>
<rect x="470" y="114" width="16" height="16" rx="3" fill="#fffafb" stroke="#be7180" stroke-width="2" stroke-dasharray="3 2"/>
<text x="495" y="128" class="small">预留 / 尚未启用</text>
<rect x="696" y="114" width="16" height="16" rx="3" fill="#f4f8fa" stroke="#55758a" stroke-width="2"/>
<text x="721" y="128" class="small">复用 / 现有基础</text>
<text x="1130" y="128" class="small">目标设计 · 尚未实施</text>
<rect data-card="Codex App Server + 原生 Skills" x="48" y="170" width="914" height="126" rx="14" fill="#f4f8fa" stroke="#55758a" stroke-width="2"/>
<text x="70" y="207" class="ct" style="fill:#55758a">Codex App Server + 原生 Skills</text>
<rect x="896" y="186" width="48" height="23" rx="5" fill="#55758a"/>
<text x="906" y="203" class="tag" style="fill:#fff">复用</text>
<text x="70" y="241" class="body">Codex 负责推理、工具循环、Thread / Turn 与事件</text>
<text x="70" y="270" class="body">Skill 指导如何执行任务，不是授权主体，也不能授予权限</text>
<rect data-card="Agent 配置与任务绑定" x="1002" y="170" width="390" height="126" rx="14" fill="#fff8f5" stroke="#db5b53" stroke-width="2"/>
<text x="1024" y="207" class="ct" style="fill:#db5b53">Agent 配置与任务绑定</text>
<rect x="1326" y="186" width="48" height="23" rx="5" fill="#db5b53"/>
<text x="1336" y="203" class="tag" style="fill:#fff">改造</text>
<text x="1024" y="241" class="body">服务端绑定用户 / Agent / 任务</text>
<text x="1024" y="270" class="body">工具范围 + KB 挂载 + 动作</text>
<path class="line" d="M503,296 L503,332"/>
<path class="line" d="M1197,296 L1197,332"/>
<rect data-card="工具统一入口 · 复用 Registry / MCP" x="48" y="332" width="1344" height="106" rx="14" fill="#fff8f5" stroke="#db5b53" stroke-width="2"/>
<text x="70" y="369" class="ct" style="fill:#db5b53">工具统一入口 · 复用 Registry / MCP</text>
<rect x="1326" y="348" width="48" height="23" rx="5" fill="#db5b53"/>
<text x="1336" y="365" class="tag" style="fill:#fff">改造</text>
<text x="70" y="403" class="body">已有 list / read / write 与新增搜索 / 更新工具统一接入；拒绝无法确认运行任务归属的调用。</text>
<path class="line" d="M600,438 L600,484"/>
<rect data-card="通用权限门禁 · 判断“是否允许执行”" x="48" y="484" width="1078" height="151" rx="14" fill="#fff5f4" stroke="#991b1b" stroke-width="2"/>
<text x="70" y="521" class="ct" style="fill:#991b1b">通用权限门禁 · 判断“是否允许执行”</text>
<rect x="1060" y="500" width="48" height="23" rx="5" fill="#991b1b"/>
<text x="1070" y="517" class="tag" style="fill:#fff">新增</text>
<text x="70" y="555" class="body">输入：可信主体 + 目标资源 + 请求动作 + 有效策略</text>
<text x="70" y="584" class="body">判断：用户资源授权 ∩ Agent 工具与挂载 ∩ 当前任务限制</text>
<text x="70" y="613" class="body">输出：允许 / 拒绝、有效范围、策略版本；不检索、不保存、不处理版本冲突。</text>
<rect data-card="拒绝执行" x="1166" y="484" width="226" height="151" rx="14" fill="#fff5f4" stroke="#991b1b" stroke-width="2"/>
<text x="1188" y="521" class="ct" style="fill:#991b1b">拒绝执行</text>
<rect x="1326" y="500" width="48" height="23" rx="5" fill="#991b1b"/>
<text x="1336" y="517" class="tag" style="fill:#fff">新增</text>
<text x="1188" y="555" class="body">权限不足</text>
<text x="1188" y="584" class="body">范围不符</text>
<text x="1188" y="613" class="body">主体不可信</text>
<path class="line" d="M1126,559 L1166,559"/>
<path class="line" d="M369,635 L369,681"/>
<path class="line" d="M1045,635 L1045,681"/>
<rect data-card="能力执行 · 文件 / Wiki" x="48" y="681" width="644" height="129" rx="14" fill="#fff8f5" stroke="#db5b53" stroke-width="2"/>
<text x="70" y="718" class="ct" style="fill:#db5b53">能力执行 · 文件 / Wiki</text>
<rect x="626" y="697" width="48" height="23" rx="5" fill="#db5b53"/>
<text x="636" y="714" class="tag" style="fill:#fff">改造</text>
<text x="70" y="752" class="body">允许后执行受限读取、搜索与更新</text>
<text x="70" y="781" class="body">Wiki 整理由 Codex + Skill 完成；默认无向量依赖</text>
<rect data-card="能力执行 · 可选 RAG" x="732" y="681" width="660" height="129" rx="14" fill="#fff5f4" stroke="#991b1b" stroke-width="2"/>
<text x="754" y="718" class="ct" style="fill:#991b1b">能力执行 · 可选 RAG</text>
<rect x="1326" y="697" width="48" height="23" rx="5" fill="#991b1b"/>
<text x="1336" y="714" class="tag" style="fill:#fff">新增</text>
<text x="754" y="752" class="body">允许后在授权分区查询 Chroma + BM25</text>
<text x="754" y="781" class="body">RRF 融合 / 可选重排；结果返回 Codex 推理</text>
<path class="line" d="M369,810 L369,835 L545,835 L545,866"/>
<path class="line" d="M1060,810 L1060,835 L895,835 L895,866"/>
<rect data-card="资源管理 · 保留现有模块，收紧职责" x="48" y="866" width="1344" height="128" rx="14" fill="#fff8f5" stroke="#db5b53" stroke-width="2"/>
<text x="70" y="903" class="ct" style="fill:#db5b53">资源管理 · 保留现有模块，收紧职责</text>
<rect x="1326" y="882" width="48" height="23" rx="5" fill="#db5b53"/>
<text x="1336" y="899" class="tag" style="fill:#fff">改造</text>
<text x="70" y="937" class="body">定位 resourceId / 文件根 / 当前有效版本 / 索引清单；管理版本、来源关系与失效状态。</text>
<text x="70" y="966" class="body">校验 expectedVersion、格式和来源状态，成功后保存并自动生效；不另算一套授权，不承担人工审核。</text>
<path class="line" d="M720,994 L720,1010 L204,1010 L204,1031"/>
<path class="line" d="M720,1010 L542,1010 L542,1031"/>
<path class="line" d="M720,1010 L880,1010 L880,1031"/>
<path class="line" d="M720,1010 L1229,1010 L1229,1031"/>
<rect data-card="PostgreSQL" x="48" y="1031" width="312" height="132" rx="14" fill="#f4f8fa" stroke="#55758a" stroke-width="2"/>
<text x="70" y="1068" class="ct" style="fill:#55758a">PostgreSQL</text>
<rect x="294" y="1047" width="48" height="23" rx="5" fill="#55758a"/>
<text x="304" y="1064" class="tag" style="fill:#fff">复用</text>
<text x="70" y="1102" class="body">权限与业务元数据</text>
<text x="70" y="1131" class="body">资源 / 版本 / 有效指针</text>
<rect data-card="文件存储" x="390" y="1031" width="304" height="132" rx="14" fill="#f4f8fa" stroke="#55758a" stroke-width="2"/>
<text x="412" y="1068" class="ct" style="fill:#55758a">文件存储</text>
<rect x="628" y="1047" width="48" height="23" rx="5" fill="#55758a"/>
<text x="638" y="1064" class="tag" style="fill:#fff">复用</text>
<text x="412" y="1102" class="body">原文 / Wiki 历史版本</text>
<text x="412" y="1131" class="body">可选 BM25 索引</text>
<rect data-card="Chroma · 可选" x="724" y="1031" width="312" height="132" rx="14" fill="#fff5f4" stroke="#991b1b" stroke-width="2"/>
<text x="746" y="1068" class="ct" style="fill:#991b1b">Chroma · 可选</text>
<rect x="970" y="1047" width="48" height="23" rx="5" fill="#991b1b"/>
<text x="980" y="1064" class="tag" style="fill:#fff">新增</text>
<text x="746" y="1102" class="body">RAG 持久向量</text>
<text x="746" y="1131" class="body">与 BM25 版本对齐</text>
<rect data-card="Redis" x="1066" y="1031" width="326" height="132" rx="14" fill="#f4f8fa" stroke="#55758a" stroke-width="2"/>
<text x="1088" y="1068" class="ct" style="fill:#55758a">Redis</text>
<rect x="1326" y="1047" width="48" height="23" rx="5" fill="#55758a"/>
<text x="1336" y="1064" class="tag" style="fill:#fff">复用</text>
<text x="1088" y="1102" class="body">队列 / 短时缓存</text>
<text x="1088" y="1131" class="body">后续登录 session</text>
<text x="48" y="1204" class="small">门禁可以查询资源元数据辅助判断；这里表达职责与授权顺序，不要求内容全部通过门禁转发。</text>
<text x="48" y="1237" class="small">权限通过不等于操作成功：无权访问由门禁拒绝，版本冲突由资源模块处理。人工审核仅作为业务可选扩展。</text>
<text x="48" y="1270" class="small">原生 Shell / 文件访问继续受限；不可用一条未接入门禁的原生路径绕过规则。本图为目标方案，尚未实施。</text>
</svg>