# 项目名沿用已有部署，保留服务器上的命名卷。
# 端口可在 .env 或终端里改：本机 5432 / 6379 已被其他服务占用时，设置 AGENT_PG_PORT / AGENT_REDIS_PORT。
name: codex-harness-app
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_DB_PASSWORD:?Set AGENT_DB_PASSWORD in .env or the terminal}
      POSTGRES_DB: agent
    ports: ["127.0.0.1:${AGENT_PG_PORT:-5432}:5432"]
    volumes: ["postgres-data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent"]
      interval: 5s
      timeout: 3s
      retries: 10
  redis:
    image: redis:7.4
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:${AGENT_REDIS_PORT:-6379}:6379"]
    volumes: ["redis-data:/data"]
  # 模型网关（Bifrost）：Codex 只连这里，再由网关转到各家模型并在失败时改用备用模型。
  # 配置由 deploy/server-setup.sh 调用 s11 生成（.data/gateway/config.json，不含密钥），每次启动都以它为准；
  # 配置库放在临时目录里，重启即清空。只把下面列出的密钥传进容器，其他 .env 内容不进。
  gateway:
    image: maximhq/bifrost:v2.4.0@sha256:a1c90607dcfd13c1fb2f9476ceb3bb24407a50ade7fdf3e61a59fb42b09e5c57
    environment:
      AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:-}
      ARK_API_KEY: ${ARK_API_KEY:-}
      KIMI_API_KEY: ${KIMI_API_KEY:-}
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      XAI_API_KEY: ${XAI_API_KEY:-}
      ZHIPU_API_KEY: ${ZHIPU_API_KEY:-}
      HUGGINGFACE_API_KEY: ${HUGGINGFACE_API_KEY:-}
    ports: ["127.0.0.1:${AGENT_GATEWAY_PORT:-4330}:8080"]
    tmpfs: ["/app/data:uid=1000,gid=0,mode=0770"]
    volumes: ["./.data/gateway/config.json:/app/data/config.json:ro", "./.data/gateway/model-parameters.json:/app/data/model-parameters.json:ro"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/health"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
  # 本地向量模型（Ollama）：用到 RAG 时才启动（部署时启用 embedding profile）。网关经容器名 http://ollama:11434 访问，不对宿主开放端口。
  # 同时只加载一个模型，空闲 5 分钟卸载以释放内存；模型文件存在数据卷里，下载由部署脚本调用 s11 的模型清单。
  ollama:
    image: ollama/ollama:0.40.14@sha256:ebaef4f4c5d93660e1f25f8ad085a112f51ccfb0e8458073e71793959dba91c9
    profiles: ["embedding"]
    environment:
      OLLAMA_KEEP_ALIVE: 5m
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
      # 向量模型的输入是切好的文本块（几百到一千多词元），不需要模型支持的最大上下文；按最大上下文预留缓存会多占数百 MB 内存。
      OLLAMA_CONTEXT_LENGTH: ${OLLAMA_CONTEXT_LENGTH:-2048}
    volumes: ["ollama-data:/root/.ollama"]
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-1536m}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped
  # 九阶段共用 web 网络空间；连接文件与 workspace 存在代码目录以外。
  # 入口预留 127.0.0.1:4331 转发到 gateway:8080；不发布宿主端口，与阶段/web 端口不重叠。
  stages:
    build:
      context: ..
      dockerfile: course/deploy/stages.Dockerfile
      args:
        NPM_REGISTRY: "${NPM_REGISTRY:-https://registry.npmjs.org}"
        APT_MIRROR: "${APT_MIRROR:-}"
        CONTAINER_STAGES_DIR: "${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}"
    image: codex-harness-stages:local
    profiles: ["app"]
    init: true
    network_mode: "service:web"
    environment:
      CONTAINER_STAGES_DIR: "${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}"
      AGENT_GATEWAY_KEY: ${AGENT_GATEWAY_KEY:-}
      AGENT_DB_PASSWORD: ${AGENT_DB_PASSWORD:-}
      CODEX_MODEL: ${CODEX_MODEL:-}
      STAGES: ${STAGES:-}
    volumes:
      - "./.data/stages:/etc/stages:ro"
      - "../stages-data/s03-service/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s03-service/.data"
      - "../stages-data/s03-service/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s03-service/.runs"
      - "../stages-data/s03-service/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s03-service/workspace"
      - "../stages-data/s04-events-messages/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s04-events-messages/.data"
      - "../stages-data/s04-events-messages/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s04-events-messages/.runs"
      - "../stages-data/s04-events-messages/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s04-events-messages/workspace"
      - "../stages-data/s05-agent-assembly/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s05-agent-assembly/.data"
      - "../stages-data/s05-agent-assembly/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s05-agent-assembly/.runs"
      - "../stages-data/s05-agent-assembly/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s05-agent-assembly/workspace"
      - "../stages-data/s06-tools/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s06-tools/.data"
      - "../stages-data/s06-tools/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s06-tools/.runs"
      - "../stages-data/s06-tools/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s06-tools/workspace"
      - "../stages-data/s07-memory/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s07-memory/.data"
      - "../stages-data/s07-memory/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s07-memory/.runs"
      - "../stages-data/s07-memory/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s07-memory/workspace"
      - "../stages-data/s08-data-layer/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s08-data-layer/.data"
      - "../stages-data/s08-data-layer/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s08-data-layer/.runs"
      - "../stages-data/s08-data-layer/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s08-data-layer/workspace"
      - "../stages-data/s09-knowledge-layer/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s09-knowledge-layer/.data"
      - "../stages-data/s09-knowledge-layer/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s09-knowledge-layer/.runs"
      - "../stages-data/s09-knowledge-layer/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s09-knowledge-layer/workspace"
      - "../stages-data/s10-skill-workflow/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s10-skill-workflow/.data"
      - "../stages-data/s10-skill-workflow/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s10-skill-workflow/.runs"
      - "../stages-data/s10-skill-workflow/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s10-skill-workflow/workspace"
      - "../stages-data/s11-model-gateway/.data:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s11-model-gateway/.data"
      - "../stages-data/s11-model-gateway/.runs:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s11-model-gateway/.runs"
      - "../stages-data/s11-model-gateway/workspace:${CONTAINER_STAGES_DIR:-${CONTAINER_APP_DIR:-/course}/../stages}/s11-model-gateway/workspace"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_started }
      gateway: { condition: service_healthy }
      web: { condition: service_started }
    mem_limit: ${STAGES_MEMORY_LIMIT:-1800m}
    stop_grace_period: 120s
    healthcheck:
      test: ["CMD", "node", "/opt/stages-deploy/run-stages.mjs", "--health"]
      interval: 15s
      timeout: 10s
      start_period: 120s
      retries: 8
    restart: unless-stopped
  web:
    build:
      context: ..
      dockerfile: course/Dockerfile
    image: codex-harness-course:local
    profiles: ["app"]
    command: ["node", "web/server.mjs"]
    ports: ["127.0.0.1:${WORKBENCH_PORT:-14320}:14320"]
    environment:
      WORKBENCH_HOST: 0.0.0.0
      WORKBENCH_PORT: "14320"
      WORKBENCH_PUBLIC_ORIGIN: ${WORKBENCH_PUBLIC_ORIGIN:-}
    volumes:
      - "../stages-data/s03-service/.data:/stages/s03-service/.data:ro"
      - "../stages-data/s04-events-messages/.data:/stages/s04-events-messages/.data:ro"
      - "../stages-data/s05-agent-assembly/.data:/stages/s05-agent-assembly/.data:ro"
      - "../stages-data/s06-tools/.data:/stages/s06-tools/.data:ro"
      - "../stages-data/s07-memory/.data:/stages/s07-memory/.data:ro"
      - "../stages-data/s08-data-layer/.data:/stages/s08-data-layer/.data:ro"
      - "../stages-data/s09-knowledge-layer/.data:/stages/s09-knowledge-layer/.data:ro"
      - "../stages-data/s10-skill-workflow/.data:/stages/s10-skill-workflow/.data:ro"
      - "../stages-data/s11-model-gateway/.data:/stages/s11-model-gateway/.data:ro"
    restart: unless-stopped
  chroma:
    image: chromadb/chroma:1.5.0
    profiles: ["rag"]
    ports: ["127.0.0.1:${AGENT_CHROMA_PORT:-8000}:8000"]
    volumes: ["chroma-data:/data"]
volumes:
  postgres-data:
  redis-data:
  chroma-data:
  ollama-data:
